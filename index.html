  if(premium)html+='<div class="joincard prem"><div class="jc-h">'+STAR+' Premium actif</div><div class="jc-d">Essai en cours, 7 jours offerts. Tu as accès à tout.</div><button class="jc-manage" onclick="toast(\'Gestion via le store, bientôt ✦\')">Gérer mon abonnement</button></div>';
  else html+='<div class="joincard"><div class="jc-h">'+STAR+' Passe premium</div><div class="jc-d">Découpe, papiers, durées, ménage de printemps. 7 jours pour essayer.</div><button class="btn-go jc-go" onclick="openPremium()">Voir le premium</button></div>';
  html+='<div class="moisec">Notifications</div><div class="setlist">'+NOTIFTYPES.map(n=>toggRow(n[1],n[2],notifs[n[0]],'toggleNotif(\''+n[0]+'\')')).join('')+'</div>';
  html+='<div class="moisec">Mails & nouveautés</div><div class="mailnote">Chaque type à part, et rien coché par défaut : c’est toi qui choisis.</div><div class="setlist">'+MAILTYPES.map(m=>toggRow(m[1],m[2],mailprefs[m[0]],'toggleMail(\''+m[0]+'\')')).join('')+'</div>';
  html+='<div class="moisec">Données</div>';
  html+='<div class="exportcard"><div class="sett"><span class="setn">Exporter mes données</span><span class="sets">Télécharge une copie dans le format de ton choix</span></div><div class="exportfmts"><button class="fmtchip" onclick="toast(\'Export JSON, bientôt ✦\')">JSON</button><button class="fmtchip" onclick="toast(\'Export CSV, bientôt ✦\')">CSV</button></div></div>';
  html+='<div class="moisec danger">Zone de danger</div>';
  html+='<button class="dangerrow" onclick="toast(\'Déconnexion, bientôt ✦\')">Se déconnecter</button>';
  html+='<button class="dangerrow" onclick="toast(\'Suppression, bientôt ✦\')">Supprimer mon compte</button>';
  return html;
}

/* ---------- render ---------- */
function render(){
  const s=el('screen');
  if(nav.tab==='maintenant'){
    if(nav.screen==='home')s.innerHTML=viewHome();
    else if(nav.screen==='plan')s.innerHTML=viewPlan();
    else if(nav.screen==='piecepick')s.innerHTML=viewPiecePick();
    else if(nav.screen==='exec')s.innerHTML=viewExec();
  }else if(nav.tab==='aujourdhui')s.innerHTML=viewAujourdhui();
  else if(nav.tab==='chezmoi'){
    if(nav.screen==='room')s.innerHTML=viewRoom();
    else s.innerHTML=viewChezMoi();
  }
  else if(nav.tab==='papiers')s.innerHTML=viewPapiers();
  else if(nav.tab==='moi'){
    if(nav.screen==='dash')s.innerHTML=viewDashboard();
    else if(nav.screen==='logement')s.innerHTML=viewLogement();
    else if(nav.screen==='compte')s.innerHTML=viewCompte();
    else if(nav.screen==='aide')s.innerHTML=viewAide();
    else if(nav.screen==='printemps')s.innerHTML=viewPrintemps();
    else s.innerHTML=viewMoi();
  }
  // onglet premium Mes papiers
  el('papTab').style.display=premium?'':'none';
  // nav actif
  [...el('nav').children].forEach(b=>b.classList.toggle('on',b.dataset.tab===nav.tab));
  updateMe();
  // slider live
  const sl=el('slider');
  if(sl){setSliderFill();sl.addEventListener('input',()=>{mins=+sl.value;el('mval').textContent=minsLabel(mins);setSliderFill();
    const ds=document.querySelector('.door.hero .ds');if(ds)ds.textContent='Ce que tu peux faire en '+minsLabel(mins);});}
  el('meBtn').style.display=(nav.tab==='moi'&&(nav.screen==='moi'||nav.screen==null))?'none':'';
  if(window.scrollReset){s.scrollTop=0;window.scrollReset=false;}
  const vfx=s.querySelector('.vfx');if(vfx)launchConfetti(vfx);else if(vfxRAF){cancelAnimationFrame(vfxRAF);vfxRAF=null;}
}
function setSliderFill(){const sl=el('slider');if(!sl)return;const pct=(sl.value-5)/(120-5)*100;sl.style.setProperty('--fill',pct+'%');}
el('nav').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(b.dataset.tab);});
el('scrim').addEventListener('click',e=>{if(e.target===el('scrim'))closeSheet();});
el('planScrim').addEventListener('click',e=>{if(e.target===el('planScrim'))closeChoisis();});
el('acctScrim').addEventListener('click',e=>{if(e.target===el('acctScrim'))closeAccountSheet();});
el('piecesMod').addEventListener('click',e=>{if(e.target===el('piecesMod'))closePiecesMod();});
el('rateMod').addEventListener('click',e=>{if(e.target===el('rateMod'))closeRate();});
el('guideMod').addEventListener('click',e=>{if(e.target===el('guideMod'))closeGuide();});
el('papierScrim').addEventListener('click',e=>{if(e.target===el('papierScrim'))closePapierSheet();});
el('printempsScrim').addEventListener('click',e=>{if(e.target===el('printempsScrim'))closePrintempsSheet();});
/* ---------- first-run / compte ---------- */
function openAccountSheet(){el('acctScrim').classList.add('show');}
function closeAccountSheet(){el('acctScrim').classList.remove('show');}
function createAccount(){account=true;acctPrompted=true;closeAccountSheet();onboardStep='appart';renderOnboard();el('onboard').classList.add('show');}
function passStep(){if(onboardStep==='appart')onboardStep='pieces';else if(onboardStep==='pieces')onboardStep='remplissage';else{finishOnboard();return;}renderOnboard();}
function chooseHousing(h){housing=h;applyHousing(h);onboardStep='pieces';renderOnboard();}
function applyHousing(h){const ids=ROOMS.map(r=>r.id);
  if(h==='maison'){if(!ids.includes('bureau'))ROOMS.push({id:'bureau',name:'Bureau',hue:'#70757c',ini:'B',order:6,icon:'desk'});if(!ids.includes('garage'))ROOMS.push({id:'garage',name:'Garage',hue:'#8a7f68',ini:'G',order:7,icon:'garage'});}
  else{ROOMS=ROOMS.filter(r=>r.id!=='bureau'&&r.id!=='garage');tasks=tasks.filter(t=>t.room!=='bureau'&&t.room!=='garage');}}
function removeOnbRoom(id){if(ROOMS.length<=1)return;ROOMS=ROOMS.filter(r=>r.id!==id);tasks=tasks.filter(t=>t.room!==id);if(editRoom===id)editRoom=null;renderOnboard();}
const ROOMPAL=['#b23a48','#5f8050','#875f87','#3f8a86','#c0882a','#2b7490'];
function toggleRoomSug(){roomSug=!roomSug;editRoom=null;orgEdit=null;refreshRooms();}
function addSugRoom(name,icon){const n='r'+Date.now().toString(36).slice(-4);ROOMS.push({id:n,name:name,hue:ROOMPAL[ROOMS.length%ROOMPAL.length],ini:(name[0]||'N').toUpperCase(),order:ROOMS.length+1,icon:icon||'generic'});roomSug=false;refreshRooms();}
function addCustomRoom(){const n='r'+Date.now().toString(36).slice(-4);ROOMS.push({id:n,name:'Nouvelle pièce',hue:ROOMPAL[ROOMS.length%ROOMPAL.length],ini:'N',order:ROOMS.length+1,icon:'generic'});roomSug=false;editRoom=n;orgEdit=n;refreshRooms();setTimeout(()=>{const i=el('obEdit');if(i){i.focus();i.select();}},30);}
function startEditRoom(id){editRoom=id;renderOnboard();setTimeout(()=>{const i=el('obEdit');if(i){i.focus();i.select();}},30);}
function commitEditRoom(id,val){const r=room(id);if(r){const v=(val||'').trim();if(v)r.name=v;}editRoom=null;renderOnboard();}
function chooseFill(f){fillChoice=f;finishOnboard();}
function finishOnboard(){const manual=fillChoice==='manual';if(manual)tasks=[];onboardStep=null;roomSug=false;el('onboard').classList.remove('show');updateMe();
  if(manual)go('chezmoi');else home();
  setTimeout(()=>openCoach(manual?'manual':'auto'),80);}
let coachIdx=0, coachMode='auto';
function coachMarks(){return [
 {sel:'#meBtn',h:'Moi',s:'Tes points, ton niveau et tes réglages. En haut à droite, partout.'},
 {sel:'[data-tab="maintenant"]',h:'Maintenant',s:'Dis-moi le temps que t’as, je te sors un plan qui rentre dedans.'},
 {sel:'[data-tab="aujourdhui"]',h:'Aujourd’hui',s:'Ta journée pièce par pièce. Tu barres au fur et à mesure.'},
 {sel:'[data-tab="chezmoi"]',h:'Chez moi',s:'Toutes tes pièces réunies, pour retrouver ou lancer n’importe quoi.'},
 {sel:'[data-tab="plus"]',h:'Ajouter',s:coachMode==='manual'?'Ta maison est vide, appuie sur le + pour ajouter ta première tâche.':'Ajoute une tâche ici. Appuie sur le + pour essayer tout de suite.'}
];}
function openCoach(mode){coachMode=mode||'auto';coachIdx=0;el('coach').classList.add('show');renderCoach();}
function coachNext(){const m=coachMarks();if(coachIdx>=m.length-1){closeCoach();return;}coachIdx++;renderCoach();}
function closeCoach(){el('coach').classList.remove('show');el('coach').innerHTML='';toast('C’est prêt ✦',true);}
function coachTap(){const mk=coachMarks()[coachIdx];const tgt=document.querySelector(mk.sel);el('coach').classList.remove('show');el('coach').innerHTML='';if(tgt)tgt.click();}
function renderCoach(){const marks=coachMarks(),m=marks[coachIdx],last=coachIdx===marks.length-1;
  const ph=document.querySelector('.phone').getBoundingClientRect();const tgt=document.querySelector(m.sel);
  if(!tgt){closeCoach();return;}
  const r=tgt.getBoundingClientRect(),pad=7;const x=r.left-ph.left,y=r.top-ph.top;const topHalf=y<ph.height/2;
  const bw=244;let bx=Math.max(12,Math.min(x+r.width/2-bw/2,ph.width-bw-12));
  const bstyle=topHalf?('left:'+bx+'px;top:'+(y+r.height+pad+12)+'px'):('left:'+bx+'px;bottom:'+(ph.height-y+pad+12)+'px');
  el('coach').innerHTML=
   '<div class="cm-spot" onclick="coachTap()" style="left:'+(x-pad)+'px;top:'+(y-pad)+'px;width:'+(r.width+2*pad)+'px;height:'+(r.height+2*pad)+'px"></div>'+
   '<div class="cm-bubble" style="'+bstyle+'"><div class="cm-h">'+m.h+'</div><div class="cm-s">'+m.s+'</div>'+
     '<div class="cm-row"><div class="cm-dots">'+marks.map((_,i)=>'<i class="'+(i===coachIdx?'on':'')+'"></i>').join('')+'</div>'+
     '<div class="cm-btns">'+(last?'':'<span class="cm-skip" onclick="closeCoach()">Passer</span>')+'<button class="cm-next" onclick="coachNext()">'+(last?'Compris ✦':'Suivant')+'</button></div></div></div>';}
/* ---------- premium ---------- */
const STAR='<svg class="star" viewBox="0 0 24 24"><path d="M12 3l2.55 5.36 5.9.78-4.34 4.06 1.1 5.86L12 16.9l-5.21 2.16 1.1-5.86-4.34-4.06 5.9-.78z"/></svg>';
function decoup(e,id){if(e&&e.stopPropagation)e.stopPropagation();if(premium){toast('Le découpage arrive bientôt ✦');}else{openPremium();}}
function openPremium(){el('prem').innerHTML=viewPremium();el('prem').classList.add('show');el('prem').scrollTop=0;}
function closePremium(){el('prem').classList.remove('show');}
function becomePremium(){premium=true;closePremium();render();updateMe();toast('Essai lancé, 7 jours offerts ✦',true);}
function premFeat(icon,title,desc,soon){return '<div class="prem-feat'+(soon?' soon':'')+'"><span class="pf-ic">'+(icon||STAR)+'</span><span><span class="pf-t">'+title+(soon?'<span class="soonlbl">bientôt</span>':'')+'</span><span class="pf-d">'+desc+'</span></span></div>';}
function viewPremium(){
  return '<div class="prem-badge">'+STAR+' Premium</div>'+
    '<div class="prem-h">L’app porte ce que tu devrais garder en tête</div>'+
    '<div class="prem-s">Ta maison tenue sans l’avoir en tête.</div>'+
    premFeat(STAR,'Découper tes tâches','Chaque corvée vague éclatée en petits gestes à cocher. Fini le « par où je commence » devant une pièce en bazar.')+
    premFeat(STAR,'Mes papiers','Tes échéances maison suivies : assurance, chaudière, impôts. L’app te prévient avant que ça morde.')+
    premFeat(STAR,'Estimation des durées','Combien de temps chaque tâche prend, calculé pour toi. Tu n’as plus à deviner.')+
    premFeat(STAR,'Ménage de printemps','Le grand coup de propre quand t’en as marre que ça traîne. L’app sort toutes les tâches de fond et t’emmène pièce par pièce.')+
    premFeat(STAR,'Maison partagée','Répartir les tâches à plusieurs, chacun son deck. Pour les colocs et les familles.',true)+
    premFeat(STAR,'Compétition','Te mesurer à toi-même, à tes amis ou au reste du monde. Toujours pour avancer, jamais pour te plomber.',true)+
    '<div class="prem-price"><div class="pp-trial">7 jours gratuits</div><div class="pp-opts"><span class="pp-opt reco">19,99 € / an</span><span class="pp-opt">1,99 € / mois</span></div><div class="pp-sub">Puis l’abo de ton choix. Sans engagement, résiliable quand tu veux.</div></div>'+
    '<button class="btn-go prem-go" onclick="becomePremium()">Essayer pendant 7 jours</button>'+
    '<div class="prem-pass" onclick="closePremium()">Peut-être plus tard</div>';
}
function renderOnboard(){const o=el('onboard');let h='';
  if(onboardStep==='appart'){
    h='<div class="ob-step">Perso · 1/3</div><div class="ob-h">Tu habites en…</div><div class="ob-s">Pour te préparer les bonnes pièces.</div>'+
      '<button class="hcard" onclick="chooseHousing(\'appart\')"><span class="hi"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2M10 21v-3h4v3"/></svg></span><span><span class="hn">Appartement</span><span class="hd">Entrée, salon, cuisine, sdb, chambre</span></span></button>'+
      '<button class="hcard" onclick="chooseHousing(\'maison\')"><span class="hi"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.3V20h14V9.3"/><path d="M10 20v-5h4v5"/></svg></span><span><span class="hn">Maison</span><span class="hd">+ bureau, garage…</span></span></button>'+
      '<div class="ob-pass" onclick="passStep()">Passer</div>';
  }else if(onboardStep==='pieces'){
    h='<div class="ob-step">Perso · 2/3</div><div class="ob-h">Tes pièces</div><div class="ob-s">Enlève ce que t’as pas, ajoute ce qui manque. Appuie sur un nom pour le changer.</div><div class="obrooms">';
    ROOMS.forEach(r=>{const ic=ROOMICON[r.icon]||ROOMICON.generic;
      if(editRoom===r.id)h+='<div class="obrt" style="--hue:'+r.hue+'"><svg class="ri" viewBox="0 0 24 24">'+ic+'</svg><input id="obEdit" value="'+esc(r.name)+'" onblur="commitEditRoom(\''+r.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()"></div>';
      else h+='<div class="obrt" style="--hue:'+r.hue+'"><svg class="ri" viewBox="0 0 24 24">'+ic+'</svg><span class="nm" onclick="startEditRoom(\''+r.id+'\')">'+esc(r.name)+'</span><svg class="pen" viewBox="0 0 24 24" onclick="startEditRoom(\''+r.id+'\')"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><button class="rm" onclick="removeOnbRoom(\''+r.id+'\')">×</button></div>';
    });
    h+='<button class="obrt add'+(roomSug?' on':'')+'" onclick="toggleRoomSug()"><svg class="ri" viewBox="0 0 24 24" style="color:currentColor"><path d="M12 5v14M5 12h14"/></svg><span class="nm">Ajouter</span></button></div>';
    if(roomSug){const have=ROOMS.map(r=>r.name.toLowerCase());
      h+='<div class="obsug"><div class="obsug-h">Ajouter une pièce</div><div class="obsug-chips">'+
        ROOMSUG.filter(s=>!have.includes(s.name.toLowerCase())).map(s=>'<button class="sugchip" onclick="addSugRoom(\''+s.name.replace(/'/g,"\\'")+'\',\''+s.icon+'\')">'+esc(s.name)+'</button>').join('')+
        '<button class="sugchip other" onclick="addCustomRoom()">+ Autre</button></div></div>';
    }
    h+='<button class="btn-go ob-cont" onclick="passStep()">Continuer</button>'+
      '<div class="ob-pass" onclick="passStep()">Passer</div>';
  }else if(onboardStep==='remplissage'){
    h='<div class="ob-step">Perso · 3/3</div><div class="ob-h">On démarre comment ?</div><div class="ob-s">Pour que ton premier plan ne tombe pas dans le vide.</div><div class="obopt">'+
      '<button class="oboc on" onclick="chooseFill(\'auto\')"><div class="t">✦ Mets-moi quelques tâches <span class="rec">reco</span></div><div class="d">Je remplis chaque pièce avec les gestes classiques. Tu ajustes après.</div></button>'+
      '<button class="oboc" onclick="chooseFill(\'manual\')"><div class="t">Je fais moi-même</div><div class="d">Pièce par pièce, à ton rythme. Tu pars d’une maison vide.</div></button></div>'+
      '<div class="ob-pass" onclick="chooseFill(\'auto\')">Passer</div>';
  }
  o.innerHTML=h;}
function updateMe(){const b=el('melbl');if(b)b.textContent=account?('Niveau '+levelInfo(xp).lvl):'Moi';}
function goBack(){
  if(nav.tab==='papiers'){home();return;}
  if(nav.tab==='moi'){if(nav.screen&&nav.screen!=='moi'){moiBack();return;}home();return;}
  if(nav.tab==='chezmoi'&&nav.screen==='room'){go('chezmoi');return;}
  if(nav.tab==='maintenant'){
    if(nav.screen==='exec'){home();return;}
    if(nav.screen==='plan'){if(nav.mode==='maison')go('chezmoi');else if(nav.mode==='piece')openPiecePicker();else home();return;}
    if(nav.screen==='piecepick'){home();return;}
  }
}
(function(){const scr=el('screen');let tsx=0,tsy=0,sk=false;const order=['maintenant','aujourdhui','chezmoi'];
  scr.addEventListener('touchstart',e=>{const t=e.target;sk=!!(t.closest&&(t.closest('input[type=range]')||t.closest('.ajhandle')));const c=e.changedTouches[0];tsx=c.clientX;tsy=c.clientY;},{passive:true});
  scr.addEventListener('touchend',e=>{if(sk||window._aujDrag)return;const c=e.changedTouches[0];const dx=c.clientX-tsx,dy=c.clientY-tsy;if(Math.abs(dx)<60||Math.abs(dy)>50)return;
    const onTab=(nav.tab==='maintenant'&&nav.screen==='home')||nav.tab==='aujourdhui'||(nav.tab==='chezmoi'&&nav.screen!=='room');
    if(dx>0){if(onTab){const i=order.indexOf(nav.tab);if(i>0)go(order[i-1]);}else goBack();}
    else{if(onTab){const i=order.indexOf(nav.tab);if(i<order.length-1)go(order[i+1]);}}
  },{passive:true});
})();
render();
</script>
