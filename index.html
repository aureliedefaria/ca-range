<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Ça range ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f2e7d6; --surface:#fdf9f1; --line:#e3d4bf; --ink:#38302a; --muted:#8d7e6c; --faint:#b1a390;
  --teal:#2d7c7e; --teal-ink:#1f5a5c; --teal-soft:#d8e7e4;
  --clay:#bd6a46; --clay-ink:#9c5436; --clay-soft:#f1ddcd;
  --ok:#5a8f5a; --ok-soft:#e6f0e1; --soon:#bf8528; --soon-soft:#f7ecd6; --late:#c0503a; --late-soft:#f7e0d8;
  --track:#e9dcc6;
  --shadow:0 1px 2px rgba(60,45,33,.05),0 10px 30px rgba(60,45,33,.07);
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cuisine:#b23a48; --salon:#5f8050; --chambre:#875f87; --sdb:#3f8a86; --entree:#c0882a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#ece0cd;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* phone shell */
.phone{width:100%;max-width:430px;min-height:100vh;position:relative;display:flex;flex-direction:column;
  background:var(--bg);box-shadow:0 0 50px rgba(60,45,33,.12);
  background-image:radial-gradient(120% 55% at 100% -6%,color-mix(in srgb,var(--clay) 12%,transparent),transparent 60%),radial-gradient(120% 60% at -10% 2%,color-mix(in srgb,var(--teal) 9%,transparent),transparent 55%);
  background-attachment:local}
#screen{flex:1;padding:24px 20px 108px;overflow-y:auto}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.h1{font-family:var(--serif);font-size:42px;line-height:.9;color:var(--ink)}
.sub{font-size:12.5px;color:var(--muted);margin-top:7px}
.lvl{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px 6px 7px;box-shadow:0 1px 2px rgba(60,45,33,.05)}
.lvl .n{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--clay) 16%,var(--surface));
  color:var(--clay);font-family:var(--serif);font-size:18px;display:grid;place-items:center;line-height:1}
.lvl .t{font-size:10px;line-height:1.25;color:var(--muted)}
.lvl .t b{display:block;color:var(--ink);font-size:11.5px;font-weight:700}

/* back row */
.back{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.back button{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;font-weight:600;padding:4px 2px}
.back svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ph1{font-family:var(--serif);font-size:34px;line-height:1;color:var(--ink);margin-top:4px}
.ph1 small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500}

/* time card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.timecard{padding:32px 22px 36px;margin-top:0}
.homebody{min-height:calc(100dvh - 240px);display:flex;flex-direction:column;justify-content:center}
.q{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.q .r{font-family:var(--sans);font-style:normal;font-size:10px;color:var(--faint)}
.tv{display:flex;align-items:baseline;gap:7px;margin-top:10px}
.tv b{font-family:var(--serif);font-size:68px;line-height:.8;color:var(--teal-ink);font-variant-numeric:tabular-nums}
.tv span{font-size:12px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:12px 0 4px}
input[type=range]::-webkit-slider-runnable-track{height:26px;border-radius:999px;background:var(--track)}
input[type=range]::-moz-range-track{height:26px;border-radius:999px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:1px;border-radius:50%;background:var(--teal);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--teal);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}

/* doors */
.lead{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);margin:24px 2px 12px}
.doors{display:flex;flex-direction:column;gap:10px}
.door{display:flex;align-items:center;gap:13px;border-radius:17px;padding:15px 16px;width:100%;text-align:left;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(60,45,33,.04);transition:transform .1s}
.door:active{transform:scale(.985)}
.door .ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--serif);font-size:21px}
.door .tx{flex:1;min-width:0}
.door .nm{display:block;font-size:15px;font-weight:700;line-height:1.1}
.door .ds{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.25}
.door .go{flex:none;color:var(--faint);font-size:18px}
.door.hero{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 1px 2px rgba(60,45,33,.05),0 10px 26px rgba(45,124,126,.28)}
.door.hero .ic{background:rgba(255,255,255,.16);color:#fff}
.door.hero .ds{color:#d6ece9}
.door.hero .go{color:rgba(255,255,255,.7)}
.door .ic.clay{background:color-mix(in srgb,var(--clay) 16%,var(--surface));color:var(--clay)}

/* plan */
.focusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--teal-soft);color:var(--teal-ink);border-radius:13px;padding:11px 14px;margin:18px 0 4px;font-size:13px}
.focusbar b{font-weight:700}
.plangrp{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:18px;color:color-mix(in srgb,var(--hue) 72%,var(--ink));margin:20px 2px 8px}
.plangrp .dot{width:10px;height:10px;border-radius:50%;background:var(--hue)}
.plangrp .gm{margin-left:auto;font-family:var(--sans);font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pstep{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:8px;transition:opacity .2s}
.pstep.done{opacity:.5}
.pnum{flex:none;width:24px;height:24px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.pstep .tx{flex:1;min-width:0}
.pstep .nm{font-size:14px;font-weight:600;line-height:1.15}
.pstep.done .nm{text-decoration:line-through;color:var(--muted)}
.pstep .mt{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pts{font-size:10px;font-weight:700;color:var(--clay);background:var(--clay-soft);padding:1px 7px;border-radius:999px;white-space:nowrap}
.check{flex:none;width:28px;height:28px;border-radius:9px;border:1.6px solid var(--muted);background:var(--bg);display:grid;place-items:center;transition:transform .1s}
.check:active{transform:scale(.9)}
.check svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on svg{opacity:1}
.plantot{margin-top:16px;font-size:12.5px;color:var(--muted);text-align:center}
.celebrate{text-align:center;padding:34px 16px}
.celebrate .big{font-family:var(--serif);font-size:30px;color:var(--teal-ink);line-height:1.1}
.celebrate .small{font-size:13px;color:var(--muted);margin-top:8px}
.celebrate .em{font-size:40px;margin-bottom:10px}

/* pill */
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ok .d{background:var(--ok)}
.pill.soon{background:var(--soon-soft);color:var(--soon)} .pill.soon .d{background:var(--soon)}
.pill.todo{background:var(--soon-soft);color:var(--soon)} .pill.todo .d{background:var(--soon)}
.pill.late{background:var(--late-soft);color:var(--late)} .pill.late .d{background:var(--late)}

/* rooms list */
.roomcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;text-align:left;margin-top:10px;transition:transform .1s}
.roomcard:active{transform:scale(.99)}
.avatar{flex:none;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--hue) 18%,var(--surface));color:color-mix(in srgb,var(--hue) 76%,var(--ink));border:1px solid color-mix(in srgb,var(--hue) 26%,transparent);display:grid;place-items:center;font-family:var(--serif);font-size:22px}
.roomcard .tx{flex:1;min-width:0}
.roomcard .rn{display:block;font-family:var(--serif);font-size:21px;line-height:1;color:color-mix(in srgb,var(--hue) 72%,var(--ink))}
.roomcard .rm{display:block;font-size:11.5px;color:var(--muted);margin-top:5px}

/* room detail rows */
.trow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:8px}
.trow .tx{flex:1;min-width:0}
.trow .nm{font-size:14px;font-weight:600}
.trow.done .nm{text-decoration:line-through;color:var(--muted)}
.trow .mt{font-size:11px;color:var(--muted);margin-top:2px}

/* routines */
.cathd{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);margin:22px 2px 4px}
.catsub{font-size:11.5px;color:var(--faint);margin:0 2px 10px}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:color-mix(in srgb,var(--surface) 95%,transparent);
  border-top:1px solid var(--line);display:flex;align-items:center;padding:0 8px;backdrop-filter:blur(8px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint)}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab .lb{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1px}
.tab.on{color:var(--teal)}
.tab.on .lb{color:var(--teal-ink);font-weight:700}
.tab.add .pl{width:34px;height:34px;border-radius:50%;background:var(--teal);display:grid;place-items:center;box-shadow:0 4px 12px rgba(45,124,126,.32)}
.tab.add .pl svg{width:21px;height:21px;stroke:#fff;stroke-width:2.3}

/* toast */
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.lvl{background:var(--clay);color:#fff}

/* modal */
.scrim{position:absolute;inset:0;background:rgba(40,32,25,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:430px;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:0 -8px 30px rgba(60,45,33,.18)}
.scrim.show .sheet{transform:translateY(0)}
.sheet h3{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--ink)}
.sheet .fl{margin-top:14px}
.sheet label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sheet input,.sheet select{width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px}
.sheet .two{display:flex;gap:10px}
.sheet .two>div{flex:1}
.sheet .act{display:flex;gap:10px;margin-top:20px}
.sheet .act button{flex:1;border-radius:12px;padding:14px;font-size:15px;font-weight:700}
.sheet .cancel{background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.sheet .save{background:var(--teal);color:#fff}

/* Aujourd'hui — lignes légères */
.allok{background:var(--teal-soft);color:var(--teal-ink);border-radius:13px;padding:13px 16px;margin:16px 0 4px;font-size:14px;text-align:center}
.aroom{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:17px;color:color-mix(in srgb,var(--hue) 72%,var(--ink));margin:20px 2px 2px}
.aroom .adot{width:9px;height:9px;border-radius:50%;background:var(--hue)}
.aline{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.aline .achk{flex:none;width:22px;height:22px;border-radius:7px;border:1.6px solid var(--muted);background:var(--bg);position:relative}
.aline .achk.on{background:var(--ok);border-color:var(--ok)}
.aline .achk.on::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.aline .an{flex:1;min-width:0;font-size:14.5px}
.aline.done .an{text-decoration:line-through;color:var(--muted)}
.aline .apill{flex:none;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.aline .apill.todo{background:var(--soon-soft);color:var(--soon)}
.aline .apill.late{background:var(--late-soft);color:var(--late)}

/* Chez moi — galerie de cartes carrées */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.gcard{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  background:color-mix(in srgb,var(--hue) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--hue) 26%,transparent);
  border-radius:18px;padding:15px;text-align:left;position:relative;transition:transform .1s}
.gcard:active{transform:scale(.97)}
.gcard .gav{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--hue) 22%,var(--surface));color:color-mix(in srgb,var(--hue) 82%,var(--ink));display:grid;place-items:center;font-family:var(--serif);font-size:20px;border:1px solid color-mix(in srgb,var(--hue) 30%,transparent)}
.gcard .gtop{display:flex;flex-direction:column;gap:3px}
.gcard .gnm{font-family:var(--serif);font-size:22px;line-height:1;color:color-mix(in srgb,var(--hue) 78%,var(--ink))}
.gcard .gmeta{font-size:11.5px;color:var(--muted)}
.gcard .gpill{position:absolute;top:14px;right:14px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface)}
.gcard .gpill.late{background:var(--late)} .gcard .gpill.todo,.gcard .gpill.soon{background:var(--soon)} .gcard .gpill.ok{background:var(--ok)}

/* Chez moi — petits carrés à icônes */
.rooms{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.rtile{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 8px 12px;text-align:center;position:relative;transition:transform .1s}
.rtile:active{transform:scale(.96)}
.rtile .ric{color:color-mix(in srgb,var(--hue) 68%,var(--ink))}
.rtile .ric svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.rtile .rtn{font-size:12px;font-weight:600;line-height:1.15;color:var(--ink)}
.rtile .rtc{font-size:10px;color:var(--muted)}
.rtile .rdot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
.rtile .rdot.late{background:var(--late)} .rtile .rdot.todo,.rtile .rdot.soon{background:var(--soon)}

/* Aujourd'hui — pièce finie repliée + tâche faite barrée sans coche */
.aroomdone{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--faint);margin:18px 2px 6px;opacity:.8;border-bottom:1px solid var(--line);padding-bottom:10px}
.aroomdone .adot{width:8px;height:8px;border-radius:50%;background:var(--hue);opacity:.45}
.aroomdone .afin{margin-left:auto;font-family:var(--sans);font-style:normal;font-size:11px;font-weight:700;color:var(--ok)}
.aline .afait{flex:none;font-size:10px;font-weight:700;color:var(--faint)}

/* Silhouette + niveau */
.hr{display:flex;align-items:center;gap:9px}
.silh{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.silh svg{width:21px;height:21px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Teaser Aujourd'hui sur Maintenant */
.teaser{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;width:100%;text-align:left;color:var(--ink);font-size:14px}
.teaser .go{color:var(--faint);font-size:18px}
.teaser b{font-family:var(--serif);font-size:19px;color:var(--clay);margin-right:3px}
.teaser.calm{justify-content:center;color:var(--teal-ink);background:var(--teal-soft);border-color:transparent}
/* Choisis — conseil + boutons */
.advice{background:var(--teal);color:#fff;border-radius:14px;padding:14px 16px;margin:16px 0 0;font-size:14px;line-height:1.5}
.advice b{font-weight:700;color:#fff}
.planbtns{display:flex;gap:10px;margin-top:12px}
.btn-ghost{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;padding:14px;border-radius:14px}
.btn-go{flex:1.6;border:0;background:var(--clay);color:#fff;font-weight:700;font-size:14px;padding:14px;border-radius:14px;box-shadow:0 6px 16px rgba(189,106,70,.26)}
.btn-go:active,.btn-ghost:active{transform:scale(.98)}
/* Exécution (grand reset) */
.execnow{background:var(--surface);border:1px solid var(--line);border-left:4px solid color-mix(in srgb,var(--hue) 70%,var(--surface));border-radius:18px;padding:18px 18px 16px;margin-top:6px;box-shadow:var(--shadow)}
.execroom{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-style:italic;font-size:15px;color:color-mix(in srgb,var(--hue) 72%,var(--ink))}
.execroom .adot{width:9px;height:9px;border-radius:50%}
.exectask{font-family:var(--serif);font-size:30px;line-height:1.08;margin:8px 0 6px;text-wrap:balance}
.execmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.execdone{margin-top:16px;width:100%;border:0;background:var(--teal);color:#fff;font-weight:700;font-size:15px;padding:15px;border-radius:13px;box-shadow:0 6px 16px rgba(45,124,126,.26)}
.execdone:active{transform:scale(.98)}
.execend{text-align:center;font-size:12.5px;color:var(--muted);margin:14px 0 2px}
.execend b{color:var(--teal-ink);font-variant-numeric:tabular-nums}
.execlbl{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--faint);margin:20px 2px 6px}
.execline{display:flex;align-items:center;gap:11px;padding:13px 4px;border-bottom:1px solid var(--line)}
.execline .exdot{flex:none;width:9px;height:9px;border-radius:50%}
.execline .exn{flex:1;min-width:0;font-size:14.5px}

  </div></div>

  <div class="scrim" id="scrim">
    <div class="sheet">

        <div>
          <label>Chaque</label>
          <select id="addFreq">
            <option value="1j">jour</option>
            <option value="2j">2 jours</option>
            <option value="1s" selected>semaine</option>
            <option value="2s">2 semaines</option>

          <label>Temps (min)</label>
          <input type="number" id="addMins" min="1" max="240" value="10" inputmode="numeric">
        </div>

        <label>Déjà fait ?</label>
        <div class="addchips"><button type="button" class="dchip on" id="dchipNo" onclick="setAddDone(false)">Jamais</button><button type="button" class="dchip" id="dchipYes" onclick="setAddDone(true)">Fait aujourd'hui</button></div>

        <button class="save" onclick="addTask()">Ajouter</button>

</div>

<script>
/* ---------- données ---------- */
let ROOMS=[
  {id:'entree',name:'Entrée',hue:'var(--entree)',ini:'E',order:1,icon:'door'},
  {id:'salon',name:'Salon',hue:'var(--salon)',ini:'S',order:2,icon:'sofa'},
  {id:'cuisine',name:'Cuisine',hue:'var(--cuisine)',ini:'C',order:3,icon:'cutlery'},
  {id:'sdb',name:'Salle de bain',hue:'var(--sdb)',ini:'B',order:4,icon:'bath'},
  {id:'chambre',name:'Chambre',hue:'var(--chambre)',ini:'Ch',order:5,icon:'bed'},
];
const ROOMICON={
  door:'<rect x="6" y="3" width="12" height="18" rx="1"/><path d="M4 21h16"/><circle cx="14.5" cy="12" r="1"/>',
  sofa:'<path d="M3 12V8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4"/><rect x="3" y="11" width="18" height="6" rx="2"/><path d="M6 17v2M18 17v2"/>',
  cutlery:'<path d="M7 3v8M5 3v3a2 2 0 0 0 4 0V3"/><path d="M8 11v10"/><path d="M15 3c-1.4 1-2 3-2 5s.8 3 2 3v10"/>',
  bath:'<path d="M4 5a2 2 0 0 1 4 0"/><path d="M3 12h18v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 12V7"/><path d="M7 19l-1 2M18 19l1 2"/>',
  bed:'<path d="M3 8v10M3 13h13a5 5 0 0 1 5 5M21 18v-3"/><rect x="6" y="9.5" width="5" height="3" rx="1"/>',
  desk:'<rect x="3" y="5" width="13" height="8" rx="1"/><path d="M9 13v3M6 16h6"/><path d="M20 7v9"/>',
  garage:'<path d="M3 21V9l9-5 9 5v12"/><path d="M6 21v-7h12v7"/><path d="M6 17h12"/>',
  generic:'<path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/>'
};
let TID=0;
function T(room,name,mins,state,freq,pts){return{id:++TID,room,name,mins,state,freq,pts,done:false};}
let tasks=[
  T('cuisine','Vider le lave-vaisselle',10,'late','1j',11),
  T('cuisine','Essuyer le plan de travail',8,'todo','1j',7),
  T('cuisine','Sortir la poubelle',4,'ok','2j',4),
  T('cuisine','Laver le sol',12,'soon','1s',11),
  T('salon','Ranger la table basse',8,'todo','1j',7),
  T('salon','Passer l’aspirateur',12,'soon','1s',11),
  T('salon','Aérer',4,'ok','1j',4),
  T('sdb','Nettoyer le lavabo',6,'ok','1j',4),
  T('sdb','Récurer la douche',12,'late','1s',11),
  T('sdb','Nettoyer le miroir',6,'soon','1s',7),
  T('chambre','Changer les draps',10,'late','2s',16),
  T('chambre','Ranger les vêtements',8,'todo','2j',7),
  T('entree','Trier le courrier',4,'todo','1j',7),
  T('entree','Ranger les chaussures',6,'ok','2j',4),
];
const FREQLBL={'1j':'tous les jours','2j':'tous les 2 jours','1s':'1× / semaine','2s':'toutes les 2 semaines','1m':'1× / mois','3m':'1× / trimestre','1a':'1× / an'};
const FREQDAYS={'1j':1,'2j':2,'1s':7,'2s':14,'1m':30,'3m':90,'1a':365};
const STLBL={ok:'à jour',soon:'bientôt',todo:'à faire',late:'en retard'};
const RANK={ok:0,soon:1,todo:2,late:3};
const LVLNAMES=['Campement','Nid douillet','Chez-soi','Cocon','Maisonnée','Petit havre','Refuge','Nid parfait','Palais douillet'];

let xp=0, mins=30;
let account=false, acctPrompted=false, onboardStep=null, housing=null, fillChoice='auto', editRoom=null, showCoach=true, premium=false;
let nav={tab:'maintenant',screen:'home',mode:null,room:null};
let planVariant=0, execIds=[], planOpen=false, chezFilter='afaire';
let addRooms=new Set(), addDone=false;
let roomSug=false;
const ROOMSUG=[{name:'Bureau',icon:'desk'},{name:'Garage',icon:'garage'},{name:'Buanderie',icon:'generic'},{name:'Dressing',icon:'generic'},{name:'WC',icon:'bath'},{name:'Balcon',icon:'generic'},{name:'Terrasse',icon:'generic'},{name:'Cave',icon:'garage'},{name:'Couloir',icon:'generic'},{name:'Chambre d’ami',icon:'bed'},{name:'Chambre d’enfant',icon:'bed'}];

/* ---------- utils ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=id=>document.getElementById(id);
function room(id){return ROOMS.find(r=>r.id===id);}
function minsLabel(m){if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+String(r).padStart(2,'0'):'');}
function due(t){return !t.done && t.state!=='ok';}
function roomTasks(rid){return tasks.filter(t=>t.room===rid).sort((a,b)=>RANK[b.state]-RANK[a.state]);}
function roomDue(rid){return roomTasks(rid).filter(due);}
function roomWorst(rid){return roomDue(rid).reduce((w,t)=>RANK[t.state]>RANK[w]?t.state:w,'ok');}
function levelInfo(x){let lvl=1,need=100,acc=0;while(x>=acc+need){acc+=need;lvl++;need=100+(lvl-1)*60;}return{lvl,into:x-acc,span:need,name:LVLNAMES[Math.min(lvl-1,LVLNAMES.length-1)],pct:Math.round((x-acc)/need*100)};}

/* ---------- plan ---------- */
// classe les pièces : la plus en retard d'abord, puis gestes urgents en tête dans chaque pièce
function roomsByUrgency(pool){
  const by=new Map();
  pool.forEach(t=>{if(!by.has(t.room))by.set(t.room,[]);by.get(t.room).push(t);});
  return [...by.entries()].map(([rid,items])=>({
    rid,
    items:items.sort((a,b)=>(RANK[b.state]-RANK[a.state])||(a.mins-b.mins)),
    worst:items.reduce((w,t)=>RANK[t.state]>RANK[w]?t.state:w,'ok'),
    urg:items.reduce((a,t)=>a+RANK[t.state],0)
  })).sort((a,b)=>(RANK[b.worst]-RANK[a.worst])||(b.urg-a.urg)||(room(a.rid).order-room(b.rid).order));
}
function pack(groups,chosen){return{chosen,groups,total:chosen.reduce((a,t)=>a+t.mins,0)};}
function buildPlan(mode,rid){
  let pool=tasks.filter(due);
  if(mode==='piece') pool=pool.filter(t=>t.room===rid);
  const ordered=roomsByUrgency(pool);
  // toute la maison : tout, juste rangé par pièce
  if(mode==='maison') return pack(ordered,pool);
  // « Un autre plan » : on fait tourner la pièce de départ sans casser la logique
  let seq=ordered;
  if(mode==='choisis'&&planVariant>0&&ordered.length>1){const k=planVariant%ordered.length;seq=ordered.slice(k).concat(ordered.slice(0,k));}
  // on finit une pièce avant de passer à la suivante, dans le budget temps
  let acc=0;const chosen=[];
  for(const g of seq){
    for(const t of g.items){if(acc+t.mins<=mins){chosen.push(t);acc+=t.mins;}}
  }
  if(!chosen.length&&pool.length){const sm=pool.slice().sort((a,b)=>a.mins-b.mins)[0];chosen.push(sm);acc=sm.mins;}
  const chosenGroups=seq.map(g=>({...g,items:g.items.filter(t=>chosen.includes(t))})).filter(g=>g.items.length);
  return pack(chosenGroups,chosen);
}
function bestRoom(){let best=null,bs=-1;ROOMS.forEach(r=>{const sc=roomDue(r.id).reduce((a,t)=>a+RANK[t.state],0);if(sc>bs){bs=sc;best=r.id;}});return bs>0?best:null;}

/* ---------- actions ---------- */
function award(pts){const before=levelInfo(xp).lvl;xp+=pts;const after=levelInfo(xp).lvl;
  if(after>before)toast('Niveau '+after+' · '+levelInfo(xp).name+' ✦',true);else toast('+'+pts+' pts ✦');}
function toggleTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;
  const wasDone=t.done;
  if(!t.done){t._prev=t.state;t.done=true;t.doneToday=true;t.state='ok';award(t.pts);}
  else{t.done=false;t.doneToday=false;t.state=t._prev||'todo';}
  render();
  if(!account&&!acctPrompted&&!wasDone){acctPrompted=true;setTimeout(openAccountSheet,500);}}
let toastT;
function toast(msg,lvl){const el2=el('toast');el2.textContent=msg;el2.className='toast show'+(lvl?' lvl':'');clearTimeout(toastT);toastT=setTimeout(()=>el2.className='toast'+(lvl?' lvl':''),2200);}

function go(tab){if(tab==='plus'){openSheet();return;}nav={tab,screen:tab==='maintenant'?'home':'list',mode:null,room:null};render();}
function openPlan(mode,rid){if(mode==='choisis'){planVariant=0;planOpen=false;}nav={tab:'maintenant',screen:'plan',mode,room:rid||null};window.scrollReset=true;render();}
function openPiecePicker(){nav={tab:'maintenant',screen:'piecepick',mode:null,room:null};render();}
function openRoom(rid){nav={tab:'chezmoi',screen:'room',mode:null,room:rid};render();}
function home(){nav={tab:'maintenant',screen:'home',mode:null,room:null};render();}

/* ---------- sheet ---------- */
function openSheet(){addRooms=new Set();addDone=false;el('addLabel').value='';el('addMins').value='10';el('addFreq').value='1s';renderAddChips();setAddDone(false);el('scrim').classList.add('show');setTimeout(()=>el('addLabel').focus(),60);}
function closeSheet(){el('scrim').classList.remove('show');}
function isAllRooms(){return ROOMS.every(r=>addRooms.has(r.id));}
function renderAddChips(){let h='<button type="button" class="addchip hero'+(isAllRooms()?' on':'')+'" onclick="toggleAllRooms()">Toute la maison</button>';h+=ROOMS.map(r=>'<button type="button" class="addchip'+(addRooms.has(r.id)?' on':'')+'" onclick="toggleAddRoom(\''+r.id+'\')">'+esc(r.name)+'</button>').join('');el('addRoomChips').innerHTML=h;}
function toggleAllRooms(){if(isAllRooms())addRooms=new Set();else addRooms=new Set(ROOMS.map(r=>r.id));renderAddChips();}
function toggleAddRoom(id){if(addRooms.has(id))addRooms.delete(id);else addRooms.add(id);renderAddChips();}
function setAddDone(v){addDone=v;el('dchipNo').classList.toggle('on',!v);el('dchipYes').classList.toggle('on',v);}
function addTask(){const lbl=el('addLabel').value.trim();if(!lbl){el('addLabel').focus();return;}
  if(!addRooms.size){toast('Choisis au moins une pièce');return;}
  const freq=el('addFreq').value;const d=FREQDAYS[freq];const pts=d<=1?4:d<=3?7:d<=7?11:16;const dur=+el('addMins').value||10;
  let last=null;
  [...addRooms].forEach(rid=>{const t=T(rid,lbl,dur,'todo',freq,pts);if(addDone){t.done=true;t.doneToday=true;t.state='ok';}tasks.push(t);last=rid;});
  closeSheet();
  toast(addRooms.size>1?'Ajoutée dans '+addRooms.size+' pièces':'Ajoutée dans '+room(last).name);
  nav={tab:'chezmoi',screen:'room',mode:null,room:last};render();
}

/* ---------- vues ---------- */
function headerHome(){const li=levelInfo(xp);
  const j=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][new Date().getDay()];
  const jcap=j.charAt(0).toUpperCase()+j.slice(1);
  return '<div class="top"><div><div class="h1">Maintenant</div></div></div>';
}
function viewHome(){
  return headerHome()+'<div class="homebody">'+
  '<div class="card timecard"><div class="q">J’ai combien de temps ?<span class="r">là, maintenant</span></div>'+
    '<div class="tv"><b id="mval">'+minsLabel(mins)+'</b><span>devant moi</span></div>'+
    '<input type="range" id="slider" min="5" max="120" step="5" value="'+mins+'">'+
    '<div class="ticks"><span>5</span><span>30</span><span>1 h</span><span>1 h 30</span><span>2 h</span></div></div>'+
  '<button class="door hero solo" onclick="openChoisis()"><span class="ic">✦</span><span class="tx"><span class="nm">Choisis pour moi</span><span class="ds">Ce que tu peux faire en '+minsLabel(mins)+'</span></span><span class="go">→</span></button>'+
  (showCoach&&!account?'<div class="coachhome">Dis-moi ton temps, puis <b>Choisis pour moi</b> ✦</div>':'')+
  '</div>';
}
function planHeader(title,sub,backTo){
  return '<div class="ph1">'+esc(title)+(sub?' <small>'+esc(sub)+'</small>':'')+'</div>';
}
function planRows(plan){
  if(!plan.chosen.length) return celebrate('Tout est à jour ✦','Rien qui presse. Tu peux souffler.');
  let n=0,html='';
  plan.groups.forEach(g=>{const r=room(g.rid);
    const gm=g.items.reduce((a,t)=>a+t.mins,0);
    html+='<div class="plangrp" style="--hue:'+r.hue+'"><span class="dot"></span>'+esc(r.name)+'<span class="gm">~'+gm+' min</span></div>';
    g.items.forEach(t=>{n++;
      html+='<div class="pstep'+(t.done?' done':'')+'"><span class="pnum">'+n+'</span>'+
        '<div class="tx"><div class="nm">'+esc(t.name)+'</div><div class="mt"><span>~'+t.mins+' min</span><span class="pts">+'+t.pts+'</span></div></div>'+
        '<button class="check'+(t.done?' on':'')+'" onclick="toggleTask('+t.id+')"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></button></div>';
    });
  });
  html+='<div class="plantot">'+plan.chosen.length+' tâche'+(plan.chosen.length>1?'s':'')+' · ~'+plan.total+' min au total</div>';
  return html;
}
function celebrate(big,small){return '<div class="celebrate"><div class="em">✦</div><div class="big">'+esc(big)+'</div><div class="small">'+esc(small)+'</div></div>';}
function victory(){
  const stars=[['st1','9%','16%',26],['st3','83%','12%',20],['st2','22%','66%',22],['st1','74%','72%',28],['st3','47%','6%',18],['st2','90%','42%',24],['st1','6%','44%',21],['st3','60%','30%',16]];
  const s=stars.map(c=>'<span class="cf '+c[0]+'" style="left:'+c[1]+';top:'+c[2]+';font-size:'+c[3]+'px">✦</span>').join('');
  return '<div class="victory">'+s+'<div class="vbig">Tout est à jour</div><div class="vsmall">Tu peux souffler.</div></div>';
}

function viewPlan(){
  if(nav.mode==='choisis'){
    const plan=buildPlan('choisis');
    const head=planHeader('Choisis pour moi',minsLabel(mins));
    if(!plan.chosen.length) return head+celebrate('Rien à faire ✦','Tout est à jour. Tu peux souffler.');
    const names=plan.groups.map(g=>room(g.rid).name.toLowerCase());
    let advice;
    if(names.length===1) advice='Je te conseille de commencer par <i>'+esc(names[0])+'</i>.';
    else if(names.length===2) advice='Je te conseille de commencer par <i>'+esc(names[0])+'</i>, puis d’enchaîner avec <i>'+esc(names[1])+'</i> si tu as encore du temps.';
    else advice='Je te conseille de commencer par <i>'+esc(names[0])+'</i>, puis d’enchaîner avec '+names.slice(1,-1).map(n=>'<i>'+esc(n)+'</i>').join(', ')+' puis <i>'+esc(names[names.length-1])+'</i> si tu as encore du temps.';
    const toggle='<button class="plantoggle" onclick="togglePlan()">'+(planOpen?'Masquer le plan':'Voir le plan')+' <span>('+plan.chosen.length+' tâche'+(plan.chosen.length>1?'s':'')+' · ~'+plan.total+' min)</span></button>';
    const body='<div class="advicebig">'+advice+'</div>'+
      '<div class="planbtns"><button class="btn-ghost" onclick="regen()">Un autre plan</button><button class="btn-go" onclick="startExec()">Bon plan, je m’y mets</button></div>'+toggle;
    return planOpen?(head+body+planRows(plan)):(head+'<div class="planbody">'+body+'</div>');
  }
  if(nav.mode==='maison'){
    const plan=buildPlan('maison');
    return planHeader('Toute la maison',null,'chezmoi')+planRows(plan);
  }
  if(nav.mode==='piece'){
    const r=room(nav.room);const plan=buildPlan('piece',nav.room);
    return planHeader(r.name,minsLabel(mins),'piece')+planRows(plan);
  }
}
function viewPiecePick(){
  let html='<div class="ph1">Quelle pièce ?</div>';
  ROOMS.forEach(r=>{const d=roomDue(r.id);const w=roomWorst(r.id);
    html+='<button class="roomcard" style="--hue:'+r.hue+'" onclick="openPlan(\'piece\',\''+r.id+'\')">'+
      '<span class="avatar">'+esc(r.ini)+'</span>'+
      '<span class="tx"><span class="rn">'+esc(r.name)+'</span><span class="rm">'+(d.length?d.length+' tâche'+(d.length>1?'s':'')+' à faire':'tout est à jour')+'</span></span>'+
      (w!=='ok'?'<span class="pill '+w+'"><span class="d"></span>'+STLBL[w]+'</span>':'<span class="pill ok"><span class="d"></span>à jour</span>')+'</button>';
  });
  return html;
}
function viewChezMoi(){
  let html='<div class="top"><div><div class="h1">Chez moi</div></div></div>';
  html+='<button class="allhouse" onclick="openPlan(\'maison\')"><span class="ahic"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg></span><span class="ahtx"><span class="ahn">Toute la maison</span><span class="ahs">Le plan complet, pièce par pièce</span></span><span class="go">→</span></button>';
  html+='<div class="filters">'+[['afaire','À faire'],['retard','En retard'],['az','A–Z']].map(f=>'<button class="fchip'+(chezFilter===f[0]?' on':'')+'" onclick="setChezFilter(\''+f[0]+'\')">'+f[1]+'</button>').join('')+'</div>';
  let rooms=ROOMS.slice();
  if(chezFilter==='afaire') rooms.sort((a,b)=>((roomDue(b.id).length>0)-(roomDue(a.id).length>0))||(RANK[roomWorst(b.id)]-RANK[roomWorst(a.id)])||(a.order-b.order));
  else if(chezFilter==='retard') rooms.sort((a,b)=>(lateCount(b.id)-lateCount(a.id))||(roomDue(b.id).length-roomDue(a.id).length)||(a.order-b.order));
  else rooms.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  html+='<div class="rooms">';
  rooms.forEach(r=>{const d=roomDue(r.id).length;const w=roomWorst(r.id);
    html+='<button class="rtile" style="--hue:'+r.hue+'" onclick="openRoom(\''+r.id+'\')">'+
      (w!=='ok'?'<span class="rdot '+w+'"></span>':'')+
      '<span class="ric"><svg viewBox="0 0 24 24">'+(ROOMICON[r.icon]||'')+'</svg></span>'+
      '<span class="rtn">'+esc(r.name)+'</span>'+
      '<span class="rtc">'+(d?d+' à faire':'à jour')+'</span>'+
      '</button>';
  });
  html+='</div>';
  return html;
}
function viewRoom(){
  const r=room(nav.room);
  let html='<div class="ph1" style="color:color-mix(in srgb,'+r.hue+' 72%,var(--ink))">'+esc(r.name)+'</div>';
  roomTasks(r.id).forEach(t=>{
    html+='<div class="trow'+(t.done||t.state==='ok'?' done':'')+'">'+
      '<button class="check'+(t.done||t.state==='ok'?' on':'')+'" onclick="toggleTask('+t.id+')"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></button>'+
      '<div class="tx"><div class="nm">'+esc(t.name)+'</div><div class="mt">~'+t.mins+' min · '+FREQLBL[t.freq]+'</div>'+
        '<button class="decoup" onclick="decoup(event,'+t.id+')">'+STAR+' Découper cette tâche</button></div>'+
      (t.done||t.state==='ok'?'<span class="pill ok"><span class="d"></span>à jour</span>':'<span class="pill '+t.state+'"><span class="d"></span>'+STLBL[t.state]+'</span>')+
      '</div>';
  });
  return html;
}
function viewAujourdhui(){
  let html='<div class="top"><div><div class="h1">Aujourd’hui</div></div></div>';
  const isToday=t=>(due(t)&&(t.state==='todo'||t.state==='late'))||t.doneToday;
  const remainingGlobal=tasks.filter(t=>due(t)&&(t.state==='todo'||t.state==='late'));
  if(!remainingGlobal.length) return html+victory();
  // ordre fixe des pièces, pas de tri par urgence ; une pièce finie se replie
  ROOMS.forEach(r=>{
    const items=tasks.filter(t=>t.room===r.id&&isToday(t));
    if(!items.length)return;
    const undone=items.filter(t=>!t.done);
    if(!undone.length){
      html+='<div class="aroomdone" style="--hue:'+r.hue+'"><span class="adot"></span>'+esc(r.name)+'<span class="afin">fini</span></div>';
      return;

  '</div>';

    rest.forEach(t=>{const rr=room(t.room);
      html+='<div class="execline" onclick="toggleTask('+t.id+')"><span class="exdot" style="background:'+rr.hue+'"></span><span class="exn">'+esc(t.name)+'</span>'+(t.started?'<span class="exstarted">en cours</span>':'<span class="exm">~'+t.mins+' min</span>')+'</div>';});}

  return html;
}

    h='<div class="ob-step">Perso · 2/3</div><div class="ob-h">Tes pièces</div><div class="ob-s">Enlève ce que t’as pas, ajoute ce qui manque. Appuie sur un nom pour le changer.</div><div class="obrooms">';
    ROOMS.forEach(r=>{const ic=ROOMICON[r.icon]||ROOMICON.generic;
      if(editRoom===r.id)h+='<div class="obrt" style="--hue:'+r.hue+'"><svg class="ri" viewBox="0 0 24 24">'+ic+'</svg><input id="obEdit" value="'+esc(r.name)+'" onblur="commitEditRoom(\''+r.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()"></div>';
      else h+='<div class="obrt" style="--hue:'+r.hue+'"><svg class="ri" viewBox="0 0 24 24">'+ic+'</svg><span class="nm" onclick="startEditRoom(\''+r.id+'\')">'+esc(r.name)+'</span><svg class="pen" viewBox="0 0 24 24" onclick="startEditRoom(\''+r.id+'\')"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><button class="rm" onclick="removeOnbRoom(\''+r.id+'\')">×</button></div>';
    });
    h+='<button class="obrt add'+(roomSug?' on':'')+'" onclick="toggleRoomSug()"><svg class="ri" viewBox="0 0 24 24" style="color:currentColor"><path d="M12 5v14M5 12h14"/></svg><span class="nm">Ajouter</span></button></div>';
    if(roomSug){const have=ROOMS.map(r=>r.name.toLowerCase());
      h+='<div class="obsug"><div class="obsug-h">Ajouter une pièce</div><div class="obsug-chips">'+
        ROOMSUG.filter(s=>!have.includes(s.name.toLowerCase())).map(s=>'<button class="sugchip" onclick="addSugRoom(\''+s.name.replace(/'/g,"\\'")+'\',\''+s.icon+'\')">'+esc(s.name)+'</button>').join('')+
        '<button class="sugchip other" onclick="addCustomRoom()">+ Autre</button></div></div>';
    }
    h+='<button class="btn-go ob-cont" onclick="passStep()">Continuer</button>'+
      '<div class="ob-pass" onclick="passStep()">Passer</div>';
  }else if(onboardStep==='remplissage'){
    h='<div class="ob-step">Perso · 3/3</div><div class="ob-h">On démarre comment ?</div><div class="ob-s">Pour que ton premier plan ne tombe pas dans le vide.</div><div class="obopt">'+
      '<button class="oboc on" onclick="chooseFill(\'auto\')"><div class="t">✦ Mets-moi quelques tâches <span class="rec">reco</span></div><div class="d">Je remplis chaque pièce avec les gestes classiques. Tu ajustes après.</div></button>'+
      '<button class="oboc" onclick="chooseFill(\'manual\')"><div class="t">Je fais moi-même</div><div class="d">Pièce par pièce, à ton rythme. Tu pars d’une maison vide.</div></button></div>'+
      '<div class="ob-pass" onclick="chooseFill(\'auto\')">Passer</div>';
  }
  o.innerHTML=h;}
function updateMe(){const b=el('melbl');if(b)b.textContent=account?('Niveau '+levelInfo(xp).lvl):'Moi';}
function goBack(){
  if(nav.tab==='moi'){if(nav.screen&&nav.screen!=='moi'){moiBack();return;}home();return;}
  if(nav.tab==='chezmoi'&&nav.screen==='room'){go('chezmoi');return;}
  if(nav.tab==='maintenant'){
    if(nav.screen==='exec'){home();return;}
    if(nav.screen==='plan'){if(nav.mode==='maison')go('chezmoi');else if(nav.mode==='piece')openPiecePicker();else home();return;}
    if(nav.screen==='piecepick'){home();return;}
  }
}
(function(){const scr=el('screen');let tsx=0,tsy=0,sk=false;const order=['maintenant','aujourdhui','chezmoi'];
  scr.addEventListener('touchstart',e=>{const t=e.target;sk=!!(t.closest&&t.closest('input[type=range]'));const c=e.changedTouches[0];tsx=c.clientX;tsy=c.clientY;},{passive:true});
  scr.addEventListener('touchend',e=>{if(sk)return;const c=e.changedTouches[0];const dx=c.clientX-tsx,dy=c.clientY-tsy;if(Math.abs(dx)<60||Math.abs(dy)>50)return;
    const onTab=(nav.tab==='maintenant'&&nav.screen==='home')||nav.tab==='aujourdhui'||(nav.tab==='chezmoi'&&nav.screen!=='room');
    if(dx>0){if(onTab){const i=order.indexOf(nav.tab);if(i>0)go(order[i-1]);}else goBack();}
    else{if(onTab){const i=order.indexOf(nav.tab);if(i<order.length-1)go(order[i+1]);}}
  },{passive:true});
})();
render();
</script>
