<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Ça range ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f2e7d6; --surface:#fdf9f1; --line:#e3d4bf; --ink:#38302a; --muted:#8d7e6c; --faint:#b1a390;
  --teal:#2d7c7e; --teal-ink:#1f5a5c; --teal-soft:#d8e7e4;
  --clay:#bd6a46; --clay-ink:#9c5436; --clay-soft:#f1ddcd;
  --ok:#5a8f5a; --ok-soft:#e6f0e1; --soon:#bf8528; --soon-soft:#f7ecd6; --late:#c0503a; --late-soft:#f7e0d8;
  --track:#e9dcc6;
  --shadow:0 1px 2px rgba(60,45,33,.05),0 10px 30px rgba(60,45,33,.07);
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cuisine:#b23a48; --salon:#5f8050; --chambre:#875f87; --sdb:#3f8a86; --entree:#c0882a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#ece0cd;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* phone shell */
.phone{width:100%;max-width:430px;min-height:100vh;position:relative;display:flex;flex-direction:column;
  background:var(--bg);box-shadow:0 0 50px rgba(60,45,33,.12);
  background-image:radial-gradient(120% 55% at 100% -6%,color-mix(in srgb,var(--clay) 12%,transparent),transparent 60%),radial-gradient(120% 60% at -10% 2%,color-mix(in srgb,var(--teal) 9%,transparent),transparent 55%);
  background-attachment:local}
#screen{flex:1;padding:24px 20px 108px;overflow-y:auto}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.h1{font-family:var(--serif);font-size:42px;line-height:.9;color:var(--ink)}
.sub{font-size:12.5px;color:var(--muted);margin-top:7px}
.lvl{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px 6px 7px;box-shadow:0 1px 2px rgba(60,45,33,.05)}
.lvl .n{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--clay) 16%,var(--surface));
  color:var(--clay);font-family:var(--serif);font-size:18px;display:grid;place-items:center;line-height:1}
.lvl .t{font-size:10px;line-height:1.25;color:var(--muted)}
.lvl .t b{display:block;color:var(--ink);font-size:11.5px;font-weight:700}

/* back row */
.back{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.back button{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;font-weight:600;padding:4px 2px}
.back svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ph1{font-family:var(--serif);font-size:34px;line-height:1;color:var(--ink);margin-top:4px}
.ph1 small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500}

/* time card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.timecard{padding:32px 22px 36px;margin-top:0}
.homebody{min-height:calc(100dvh - 240px);display:flex;flex-direction:column;justify-content:center}
.q{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.q .r{font-family:var(--sans);font-style:normal;font-size:10px;color:var(--faint)}
.tv{display:flex;align-items:baseline;gap:7px;margin-top:10px}
.tv b{font-family:var(--serif);font-size:68px;line-height:.8;color:var(--teal-ink);font-variant-numeric:tabular-nums}
.tv span{font-size:12px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:12px 0 4px;--fill:22%}
input[type=range]::-webkit-slider-runnable-track{height:26px;border-radius:999px;background:linear-gradient(to right,var(--teal) 0,var(--teal) var(--fill),var(--track) var(--fill),var(--track) 100%)}
input[type=range]::-moz-range-track{height:26px;border-radius:999px;background:linear-gradient(to right,var(--teal) 0,var(--teal) var(--fill),var(--track) var(--fill),var(--track) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:1px;border-radius:50%;background:var(--teal);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--teal);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}

/* doors */
.lead{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);margin:24px 2px 12px}
.doors{display:flex;flex-direction:column;gap:10px}
.door{display:flex;align-items:center;gap:13px;border-radius:17px;padding:15px 16px;width:100%;text-align:left;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(60,45,33,.04);transition:transform .1s}
.door:active{transform:scale(.985)}
.door .ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--serif);font-size:21px}
.door .tx{flex:1;min-width:0}
.door .nm{display:block;font-size:15px;font-weight:700;line-height:1.1}
.door .ds{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.25}
.door .go{flex:none;color:var(--faint);font-size:18px}
.door.hero{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 1px 2px rgba(60,45,33,.05),0 10px 26px rgba(45,124,126,.28)}
.door.hero .ic{background:rgba(255,255,255,.16);color:#fff}
.door.hero .ds{color:#d6ece9}
.door.hero .go{color:rgba(255,255,255,.7)}
.door .ic.clay{background:color-mix(in srgb,var(--clay) 16%,var(--surface));color:var(--clay)}

/* plan */
.focusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--teal-soft);color:var(--teal-ink);border-radius:13px;padding:11px 14px;margin:18px 0 4px;font-size:13px}
.focusbar b{font-weight:700}
.plangrp{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:18px;color:color-mix(in srgb,var(--hue) 72%,var(--ink));margin:20px 2px 8px}
.plangrp .dot{width:10px;height:10px;border-radius:50%;background:var(--hue)}
.plangrp .gm{margin-left:auto;font-family:var(--sans);font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pstep{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:8px;transition:opacity .2s}
.pstep.done{opacity:.5}
.pnum{flex:none;width:24px;height:24px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.pstep .tx{flex:1;min-width:0}
.pstep .nm{font-size:14px;font-weight:600;line-height:1.15}
.pstep.done .nm{text-decoration:line-through;color:var(--muted)}
.pstep .mt{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pts{font-size:10px;font-weight:700;color:var(--clay);background:var(--clay-soft);padding:1px 7px;border-radius:999px;white-space:nowrap}
.check{flex:none;width:28px;height:28px;border-radius:9px;border:1.6px solid var(--muted);background:var(--bg);display:grid;place-items:center;transition:transform .1s}
.check:active{transform:scale(.9)}
.check svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on svg{opacity:1}
.plantot{margin-top:16px;font-size:12.5px;color:var(--muted);text-align:center}
.celebrate{text-align:center;padding:34px 16px}
.celebrate .big{font-family:var(--serif);font-size:30px;color:var(--teal-ink);line-height:1.1}
.celebrate .small{font-size:13px;color:var(--muted);margin-top:8px}
.celebrate .em{font-size:40px;margin-bottom:10px}

/* pill */
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ok .d{background:var(--ok)}
.pill.soon{background:var(--soon-soft);color:var(--soon)} .pill.soon .d{background:var(--soon)}
.pill.todo{background:var(--soon-soft);color:var(--soon)} .pill.todo .d{background:var(--soon)}
.pill.late{background:var(--late-soft);color:var(--late)} .pill.late .d{background:var(--late)}

/* rooms list */
.roomcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;text-align:left;margin-top:10px;transition:transform .1s}
.roomcard:active{transform:scale(.99)}
.avatar{flex:none;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--hue) 18%,var(--surface));color:color-mix(in srgb,var(--hue) 76%,var(--ink));border:1px solid color-mix(in srgb,var(--hue) 26%,transparent);display:grid;place-items:center;font-family:var(--serif);font-size:22px}
.roomcard .tx{flex:1;min-width:0}
.roomcard .rn{display:block;font-family:var(--serif);font-size:21px;line-height:1;color:color-mix(in srgb,var(--hue) 72%,var(--ink))}
.roomcard .rm{display:block;font-size:11.5px;color:var(--muted);margin-top:5px}

/* room detail rows */
.trow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:8px}
.trow .tx{flex:1;min-width:0}
.trow .tx.tap{cursor:pointer}
.paplist{margin-top:16px}
.moitools{margin-top:18px}
.rctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 2px 0;font-size:14px;color:var(--muted)}
.rctl input[type=time]{font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.rlink{border:0;background:none;color:var(--teal-ink);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.rset{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.rset label{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.rset input[type=number]{width:52px;text-align:center;font-size:13px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.rnow{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px rgba(60,45,33,.06);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.rnow .rz{font-family:var(--serif);font-size:17px;color:color-mix(in srgb,var(--hue) 74%,var(--ink))}
.rnow .rtask{font-family:var(--serif);font-size:27px;line-height:1.1}
.rnow .rmeta{font-size:13px;color:var(--muted)}
.rnote{font-size:13px;background:color-mix(in srgb,var(--clay) 12%,var(--surface));color:var(--ink);border-radius:10px;padding:9px 12px}
.rnow .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rnow .execdone{width:auto;margin:0}
.rsum{font-size:13px;color:var(--muted)}
.rsum b{color:var(--ink)}
.rhead2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--serif);font-size:19px;color:var(--ink);margin:24px 2px 10px}
.rhead2 span{font-family:var(--sans);font-size:12.5px;color:var(--faint)}
.rlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rlist .plangrp{border-top:1px solid var(--line)}
.rlist .plangrp:first-child{border-top:none}
.rline{display:flex;align-items:center;gap:11px;padding:12px 15px;border-top:1px solid var(--line)}
.rline .rt{flex:0 0 3.5em;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rline .tx{flex:1;min-width:0}
.rline .nm{font-size:14px;font-weight:500}
.rline .mt{font-size:11.5px;color:var(--muted);margin-top:2px}
.rline .rd{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rline.cur{background:var(--teal-soft)}
.rline.cur .nm{font-weight:700}
.rline.brk .nm{color:var(--teal-ink);font-style:italic}
.rline.done .nm{text-decoration:line-through;color:var(--muted)}
.papintro{font-size:13px;color:var(--muted);line-height:1.5;margin:2px 2px 14px;max-width:34ch}
.papempty{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px}
.trow.pap{cursor:pointer}
.papdot{width:11px;height:11px;border-radius:50%;flex:none}
.addhere{width:100%;margin-top:14px;background:var(--surface);border:1px dashed var(--teal);border-radius:14px;padding:13px;font:inherit;font-size:14px;font-weight:700;color:var(--teal-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.addhere svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.delrow{width:100%;margin-top:6px;background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:13.5px;font-weight:700;color:var(--clay);cursor:pointer}
.delrow.arm{background:color-mix(in srgb,var(--clay) 12%,var(--surface));border-color:var(--clay)}
.trow .nm{font-size:14px;font-weight:600}
.trow.done .nm{text-decoration:line-through;color:var(--muted)}
.trow .mt{font-size:11px;color:var(--muted);margin-top:2px}

/* routines */
.cathd{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);margin:22px 2px 4px}
.catsub{font-size:11.5px;color:var(--faint);margin:0 2px 10px}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:color-mix(in srgb,var(--surface) 95%,transparent);
  border-top:1px solid var(--line);display:flex;align-items:center;padding:0 8px;backdrop-filter:blur(8px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint)}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab .lb{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1px}
.tab.on{color:var(--teal)}
.tab.on .lb{color:var(--teal-ink);font-weight:700}
.tab.add .pl{width:34px;height:34px;border-radius:50%;background:var(--teal);display:grid;place-items:center;box-shadow:0 4px 12px rgba(45,124,126,.32)}
.tab.add .pl svg{width:21px;height:21px;stroke:#fff;stroke-width:2.3}

/* toast */
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.lvl{background:var(--clay);color:#fff}

/* modal */
.scrim{position:absolute;inset:0;background:rgba(40,32,25,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:430px;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:0 -8px 30px rgba(60,45,33,.18)}
.scrim.show .sheet{transform:translateY(0)}
.sheet h3{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--ink)}
.sheet .fl{margin-top:14px}
.sheet label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sheet input,.sheet select{width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px}
.sheet .two{display:flex;gap:10px}
.sheet .two>div{flex:1}
.sheet .act{display:flex;gap:10px;margin-top:20px}
.sheet .act button{flex:1;border-radius:12px;padding:14px;font-size:15px;font-weight:700}
.sheet .cancel{background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.sheet .save{background:var(--teal);color:#fff}

/* Aujourd'hui — lignes légères */
.allok{background:var(--teal-soft);color:var(--teal-ink);border-radius:13px;padding:13px 16px;margin:16px 0 4px;font-size:14px;text-align:center}
.aroom{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:17px;color:color-mix(in srgb,var(--hue) 72%,var(--ink));margin:20px 2px 2px}
.aroom .adot{width:9px;height:9px;border-radius:50%;background:var(--hue)}
.aline{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.aline .achk{flex:none;width:22px;height:22px;border-radius:7px;border:1.6px solid var(--muted);background:var(--bg);position:relative}
.aline .achk.on{background:var(--ok);border-color:var(--ok)}
.aline .achk.on::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.aline .an{flex:1;min-width:0;font-size:14.5px}
.aline.done .an{text-decoration:line-through;color:var(--muted)}
.aline .apill{flex:none;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.aline .apill.todo{background:var(--soon-soft);color:var(--soon)}
.aline .apill.late{background:var(--late-soft);color:var(--late)}

/* Chez moi — galerie de cartes carrées */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.gcard{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  background:color-mix(in srgb,var(--hue) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--hue) 26%,transparent);
  border-radius:18px;padding:15px;text-align:left;position:relative;transition:transform .1s}
.gcard:active{transform:scale(.97)}
.gcard .gav{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--hue) 22%,var(--surface));color:color-mix(in srgb,var(--hue) 82%,var(--ink));display:grid;place-items:center;font-family:var(--serif);font-size:20px;border:1px solid color-mix(in srgb,var(--hue) 30%,transparent)}
.gcard .gtop{display:flex;flex-direction:column;gap:3px}
.gcard .gnm{font-family:var(--serif);font-size:22px;line-height:1;color:color-mix(in srgb,var(--hue) 78%,var(--ink))}
.gcard .gmeta{font-size:11.5px;color:var(--muted)}
.gcard .gpill{position:absolute;top:14px;right:14px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface)}
.gcard .gpill.late{background:var(--late)} .gcard .gpill.todo,.gcard .gpill.soon{background:var(--soon)} .gcard .gpill.ok{background:var(--ok)}

/* Chez moi — petits carrés à icônes */
.rooms{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.rtile{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 8px 12px;text-align:center;position:relative;transition:transform .1s}
.rtile:active{transform:scale(.96)}
.rtile .ric{color:color-mix(in srgb,var(--hue) 68%,var(--ink))}
.rtile .ric svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.rtile .rtn{font-size:12px;font-weight:600;line-height:1.15;color:var(--ink)}
.rtile .rtc{font-size:10px;color:var(--muted)}
.rtile .rdot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
.rtile .rdot.late{background:var(--late)} .rtile .rdot.todo,.rtile .rdot.soon{background:var(--soon)}

/* Aujourd'hui — pièce finie repliée + tâche faite barrée sans coche */
.aroomdone{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--faint);margin:18px 2px 6px;opacity:.8;border-bottom:1px solid var(--line);padding-bottom:10px}
.aroomdone .adot{width:8px;height:8px;border-radius:50%;background:var(--hue);opacity:.45}
.aroomdone .afin{margin-left:auto;font-family:var(--sans);font-style:normal;font-size:11px;font-weight:700;color:var(--ok)}
.aline .afait{flex:none;font-size:10px;font-weight:700;color:var(--faint)}

/* Silhouette + niveau */
.hr{display:flex;align-items:center;gap:9px}
.silh{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.silh svg{width:21px;height:21px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Teaser Aujourd'hui sur Maintenant */
.teaser{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;width:100%;text-align:left;color:var(--ink);font-size:14px}
.teaser .go{color:var(--faint);font-size:18px}
.teaser b{font-family:var(--serif);font-size:19px;color:var(--clay);margin-right:3px}
.teaser.calm{justify-content:center;color:var(--teal-ink);background:var(--teal-soft);border-color:transparent}
/* Choisis — conseil + boutons */
.advice{background:var(--teal);color:#fff;border-radius:14px;padding:14px 16px;margin:16px 0 0;font-size:14px;line-height:1.5}
.advice b{font-weight:700;color:#fff}
.planbtns{display:flex;gap:10px;margin-top:12px}
.btn-ghost{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;padding:14px;border-radius:14px}
.btn-go{flex:1.6;border:0;background:var(--clay);color:#fff;font-weight:700;font-size:14px;padding:14px;border-radius:14px;box-shadow:0 6px 16px rgba(189,106,70,.26)}
.btn-go:active,.btn-ghost:active{transform:scale(.98)}
/* Exécution (grand reset) */
.execnow{background:var(--surface);border:1px solid var(--line);border-left:4px solid color-mix(in srgb,var(--hue) 70%,var(--surface));border-radius:18px;padding:18px 18px 16px;margin-top:6px;box-shadow:var(--shadow)}
.execroom{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-style:italic;font-size:15px;color:color-mix(in srgb,var(--hue) 72%,var(--ink))}
.execroom .adot{width:9px;height:9px;border-radius:50%}
.exectask{font-family:var(--serif);font-size:30px;line-height:1.08;margin:8px 0 6px;text-wrap:balance}
.execmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.execdone{margin-top:16px;width:100%;border:0;background:var(--teal);color:#fff;font-weight:700;font-size:15px;padding:15px;border-radius:13px;box-shadow:0 6px 16px rgba(45,124,126,.26)}
.execdone:active{transform:scale(.98)}
.execend{text-align:center;font-size:12.5px;color:var(--muted);margin:14px 0 2px}
.execend b{color:var(--teal-ink);font-variant-numeric:tabular-nums}
.execlbl{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--faint);margin:20px 2px 6px}
.execline{display:flex;align-items:center;gap:11px;padding:13px 4px;border-bottom:1px solid var(--line)}
.execline .exdot{flex:none;width:9px;height:9px;border-radius:50%}
.execline .exn{flex:1;min-width:0;font-size:14.5px}
.execline .exm{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.execline.done .exn{text-decoration:line-through;color:var(--muted)}
.execline .exfait{flex:none;font-size:10px;font-weight:700;color:var(--faint)}
.execfoot{margin-top:18px}
.execfoot .btn-go{width:100%}
/* Moi / réglages */
.moicard{padding:18px}
.moilvl{display:flex;align-items:center;gap:15px}
.moin{flex:none;width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--clay) 15%,var(--surface));color:var(--clay);font-family:var(--serif);font-size:30px;display:grid;place-items:center}
.moiname{font-family:var(--serif);font-size:19px;color:var(--ink)}
.moisub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;background:var(--clay);border-radius:999px}
.setlist{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.setrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;width:100%;text-align:left}
.setrow .sett{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.setrow .setn{font-size:14.5px;font-weight:700;color:var(--ink)}
.setrow .sets{font-size:11.5px;color:var(--muted)}
.setrow .go{color:var(--faint);font-size:18px}
/* Niveau fusionné silhouette */
.me{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;box-shadow:0 1px 2px rgba(60,45,33,.05)}
.me .mesilh{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--clay) 14%,var(--surface));display:grid;place-items:center;flex:none}
.me .mesilh svg{width:19px;height:19px;stroke:var(--clay);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.me .melvl{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.me .melvl b{font-size:11.5px;color:var(--ink);font-weight:700}
.me .melvl span{font-size:10px;color:var(--muted)}
/* Exécution — options + recalcul */
.execopts{display:flex;gap:8px;margin-top:10px}
.execopts button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:9px;border-radius:10px}
.execopts button:active{transform:scale(.98)}
.recalc{border:0;background:none;color:var(--teal-ink);font-size:11px;font-weight:700;padding:2px 4px;margin-left:4px;text-decoration:underline;text-underline-offset:2px}
.execline .exstarted{flex:none;font-size:10px;font-weight:700;color:var(--teal-ink)}
/* Conseil agrandi + toggle plan */
.advicebig{font-family:var(--serif);font-size:23px;line-height:1.3;color:var(--ink);margin:18px 2px 2px;text-wrap:balance}
.advicebig i{font-style:italic}
.plantoggle{display:block;width:100%;text-align:center;margin-top:16px;background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.plantoggle span{color:var(--faint);text-decoration:none;font-weight:500}
/* Chez moi — toute la maison + filtres */
.allhouse{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;width:100%;text-align:left;margin-top:14px}
.allhouse .ahic{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--clay) 14%,var(--surface));display:grid;place-items:center;flex:none;border:1px solid color-mix(in srgb,var(--clay) 22%,transparent)}
.allhouse .ahic svg{width:22px;height:22px;stroke:var(--clay);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.allhouse .ahtx{flex:1;min-width:0;display:flex;flex-direction:column}
.allhouse .ahn{font-size:15px;font-weight:700;color:var(--ink)}
.allhouse .ahs{font-size:11.5px;color:var(--muted)}
.allhouse .go{color:var(--faint);font-size:18px}
.filters{display:flex;gap:7px;margin:16px 0 0;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px}
.fchip.on{background:var(--teal);border-color:var(--teal);color:#fff}
/* bouton démarrer le focus */
.focusstart{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--teal);color:#fff;border:0;border-radius:14px;padding:13px;font:inherit;font-size:14px;font-weight:700;margin:14px 0 4px;cursor:pointer}
.focusstart svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* session de focus plein écran */
#focus{position:absolute;inset:0;z-index:58;background:var(--bg);display:none;flex-direction:column;
  background-image:radial-gradient(120% 55% at 100% -8%,color-mix(in srgb,var(--clay) 11%,transparent),transparent 60%),radial-gradient(120% 60% at -10% 2%,color-mix(in srgb,var(--teal) 10%,transparent),transparent 55%)}
#focus.show{display:flex}
.fx-wrap{flex:1;display:flex;flex-direction:column;padding:28px 24px calc(28px + env(safe-area-inset-bottom,0px))}
.fx-top{display:flex;align-items:center;justify-content:space-between}
.fx-time{font-family:var(--serif);font-size:30px;color:var(--teal-ink);font-variant-numeric:tabular-nums;line-height:1}
.fx-time.over{color:var(--clay)}
.fx-close{background:none;border:0;color:var(--faint);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.fx-mid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.fx-prog{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.fx-room{font-family:var(--serif);font-style:italic;font-size:18px;margin-bottom:8px}
.fx-task{font-family:var(--serif);font-size:34px;line-height:1.12;text-wrap:balance;margin-bottom:10px}
.fx-mins{font-size:14px;color:var(--muted)}
.fx-actions{display:flex;flex-direction:column;gap:12px;align-items:center}
.fx-done{flex:none;width:100%}
.fx-skip{background:none;border:0;color:var(--faint);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.fx-end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fx-star{font-size:40px;color:var(--teal);margin-bottom:14px}
.fx-bh{font-family:var(--serif);font-size:32px;margin-bottom:8px}
.fx-bs{font-size:14px;color:var(--muted);margin-bottom:26px;max-width:26ch}
.fx-go{flex:none;width:100%;max-width:300px}
/* Aujourd'hui : conteneur pièce + poignée + repli */
.aujroom{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-top:12px;transition:transform .16s ease}
.aujroom:first-of-type{margin-top:16px}
.aujroom.done{background:color-mix(in srgb,var(--surface) 60%,transparent);border-style:dashed}
.aujroom.dragging{transition:none;z-index:6;position:relative;border-color:var(--teal);box-shadow:0 14px 30px color-mix(in srgb,var(--teal) 24%,transparent)}
.aujroom.dragging .ajhandle{color:var(--teal-ink)}
.aujroom .aline{padding:11px 0}
.aujroom .aline:not(:last-child){border-bottom:1px solid var(--line)}
.aujroom .aline:last-child{border-bottom:0}
.aujroom .aroom{padding:9px 0 7px}
.aujroom.done .aroomdone{margin:0;border-bottom:0;padding:8px 0}
.aroom{margin:0}
.aroom .ajhandle{display:flex;align-items:center;color:var(--faint);cursor:grab;touch-action:none;padding:4px 2px 4px 0;margin-left:-2px}
.aroom .ajhandle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.aroom .aroom-nm{cursor:pointer}
.aroom .aroom-c{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--sans);font-style:normal;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.aroom .achev{width:16px;height:16px;fill:none;stroke:var(--faint);stroke-width:2;transition:transform .2s}
.aroom .achev.col{transform:rotate(-90deg)}
.aujbar{min-height:14px;margin-top:14px;display:flex;justify-content:flex-end}
.aujreset{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.aujreset svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* champ date */
.datefield{margin-top:9px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}
/* Organiser : mes pièces + icônes */
.obrooms.orgp{margin-top:16px}
.obrt .ri-btn{border:0;background:none;padding:0;display:flex;cursor:pointer}
.obrt .ri-btn .ri{width:20px;height:20px}
.iconpick{margin-top:14px;background:color-mix(in srgb,var(--teal-soft) 40%,var(--surface));border:1px solid var(--line);border-radius:14px;padding:13px}
.iconpick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:9px}
.iconcell{aspect-ratio:1;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.iconcell svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconcell.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.iconcell.on svg{stroke:var(--teal-ink)}
/* Organiser : ordre des pièces */
.ordlist{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.ordrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;transition:transform .16s ease}
.ordrow.dragging{transition:none;z-index:6;position:relative;border-color:var(--teal);box-shadow:0 12px 28px color-mix(in srgb,var(--teal) 26%,transparent)}
.ordrow .ordnum{font-family:var(--serif);font-size:19px;color:var(--teal-ink);width:20px;text-align:center}
.ordrow .ajhandle{display:flex;color:var(--faint);cursor:grab;touch-action:none;padding:4px 0}
.ordrow .ajhandle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.ordrow .ri{width:20px;height:20px;flex:none;color:color-mix(in srgb,var(--hue) 68%,var(--ink));stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ordrow{gap:9px}
.ordrow .ordnm{font-size:14.5px;font-weight:600;flex:1;min-width:0}
.ordrow .ri-btn{border:0;background:none;padding:0;display:flex;cursor:pointer}
.ordrow .ri-btn .ri{width:20px;height:20px;color:color-mix(in srgb,var(--hue) 68%,var(--ink));stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ordrow .ordedit{flex:1;min-width:0;font:inherit;font-size:14.5px;font-weight:600;border:0;background:transparent;outline:none;border-bottom:1.5px solid var(--teal);color:var(--ink)}
.ordrow .pen{width:15px;height:15px;flex:none;color:var(--faint);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.ordrow .rm{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;padding:0 2px;cursor:pointer;flex:none}
.dsub2{font-size:12.5px;color:var(--muted);margin:4px 2px 12px;line-height:1.4}
.lgadd{margin-top:12px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:13px;padding:12px;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.lgadd.on{border-color:var(--teal);color:var(--teal-ink)}
/* Organiser : mon logement */
.hopts{display:flex;gap:11px;margin-top:4px}
.hopt{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px 10px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--ink)}
.hopt svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hopt.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.hopt.on svg{stroke:var(--teal-ink)}
.hhlist{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.hhempty{font-size:13px;color:var(--muted);padding:6px 2px}
.hhrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.hhav{width:32px;height:32px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--clay) 14%,var(--surface));color:var(--clay);font-family:var(--serif);font-size:16px;display:grid;place-items:center}
.hhn{flex:1;font-size:14.5px;font-weight:600}
.hhyou{font-size:10px;font-weight:700;color:var(--teal-ink);background:var(--teal-soft);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.hhadd{display:flex;gap:9px;margin-top:12px}
.hhadd input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink);outline:none}
.hhaddbtn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:0 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.hhav.animal{background:color-mix(in srgb,var(--teal) 14%,var(--surface));color:var(--teal-ink)}
.hhav.animal svg{width:18px;height:18px;fill:currentColor;stroke:none}
.hhkind{display:flex;gap:7px;margin-top:12px}
.kbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer}
.kbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
/* type en réglage (segmenté) */
.typeseg{display:inline-flex;background:var(--track);border-radius:999px;padding:3px;gap:2px}
.segbtn{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:8px 18px;border-radius:999px;cursor:pointer}
.segbtn.on{background:var(--surface);color:var(--teal-ink);box-shadow:0 1px 3px rgba(60,45,33,.12)}
/* pop-up modifier les pièces */
#piecesMod{position:absolute;inset:0;z-index:56;display:none;background:rgba(38,29,22,.5)}
#piecesMod.show{display:flex;align-items:flex-end}
.pm-sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;max-height:84vh;overflow-y:auto;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(38,29,22,.28)}
.pm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.pm-h{font-family:var(--serif);font-size:24px}
.pm-done{background:var(--teal);color:#fff;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.apill.encours{background:var(--teal-soft);color:var(--teal-ink)}
/* Coach première visite */
.coachhome{margin-top:18px;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:600;text-align:center}
.coachhome b{font-weight:700}
/* Sheet compte */
.auth-h{font-family:var(--serif);font-size:24px;text-align:center}
.auth-s{font-size:12px;color:var(--muted);text-align:center;margin:6px 8px 16px;line-height:1.35}
.authbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;padding:13px;font-size:14px;font-weight:700;margin-top:9px;border:0}
.authbtn.apple{background:var(--ink);color:var(--bg)}
.authbtn.google{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.authbtn.mail{background:transparent;color:var(--muted);font-weight:600}
.auth-s b{font-weight:700;color:var(--teal-ink)}
.auth-free{text-align:center;font-size:11px;color:var(--muted);margin-top:12px}
.auth-later{text-align:center;font-size:12.5px;color:var(--faint);font-weight:600;margin-top:10px;text-decoration:underline;text-underline-offset:2px}
/* Onboarding overlay */
#onboard{position:absolute;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;
  padding:30px 20px calc(22px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(120% 55% at 100% -8%,color-mix(in srgb,var(--clay) 12%,transparent),transparent 60%),radial-gradient(120% 60% at -10% 2%,color-mix(in srgb,var(--teal) 9%,transparent),transparent 55%)}
#onboard.show{display:flex}
#coach{position:absolute;inset:0;z-index:60;display:none}
#coach.show{display:block}
.cm-spot{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(38,29,22,.60);border:2px solid var(--teal);transition:all .24s ease;pointer-events:auto;cursor:pointer}
.cm-bubble{position:absolute;width:244px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:0 14px 34px rgba(60,45,33,.26);animation:cmpop .26s ease}
@keyframes cmpop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.cm-h{font-family:var(--serif);font-size:21px;line-height:1.1;margin-bottom:4px}
.cm-s{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:13px}
.cm-row{display:flex;align-items:center;justify-content:space-between}
.cm-dots{display:flex;gap:5px}
.cm-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .25s}
.cm-dots i.on{background:var(--teal);width:16px;border-radius:999px}
.cm-btns{display:flex;align-items:center;gap:12px}
.cm-skip{color:var(--faint);font-size:12.5px;font-weight:600}
.cm-next{background:var(--teal);color:#fff;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;font-weight:700}
/* étoile premium + crochet découper */
.star{display:inline-block;width:13px;height:13px;vertical-align:-1px;fill:var(--clay);stroke:none}
.decoup{border:0;background:none;font:inherit;font-size:11px;font-weight:700;color:var(--clay);display:inline-flex;align-items:center;gap:4px;padding:3px 0;margin-top:3px;cursor:pointer}
.decoup .star{fill:var(--clay)}
.aline .ameta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aline .atx{flex:1;min-width:0;display:flex;flex-direction:column}
.aline .ameta .decoup{margin-top:0}
/* page Passe premium */
#prem{position:absolute;inset:0;z-index:55;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;
  padding:30px 22px calc(24px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(120% 55% at 100% -8%,color-mix(in srgb,var(--clay) 13%,transparent),transparent 60%),radial-gradient(120% 60% at -10% 2%,color-mix(in srgb,var(--teal) 9%,transparent),transparent 55%)}
#prem.show{display:flex}
.prem-badge{font-size:11px;font-weight:700;color:var(--clay);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.prem-h{font-family:var(--serif);font-size:32px;line-height:1.08;margin:8px 0 6px;text-wrap:balance}
.prem-s{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:20px;max-width:32ch}
.prem-feat{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}
.prem-feat.soon{opacity:.72}
.prem-feat .pf-ic{flex:none;width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--clay) 13%,var(--surface));display:grid;place-items:center}
.prem-feat .pf-ic .star{width:18px;height:18px}
.prem-feat .pf-t{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prem-feat .pf-t .soonlbl{font-size:9px;font-weight:700;color:#fff;background:var(--faint);padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.prem-feat .pf-d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.prem-price{text-align:center;margin:18px 0 4px}
.prem-price .pp-trial{font-family:var(--serif);font-size:27px;color:var(--teal-ink)}
.prem-price .pp-opts{display:flex;gap:9px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.prem-price .pp-opt{font-size:13px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px}
.prem-price .pp-opt.reco{border-color:var(--teal);color:var(--teal-ink);box-shadow:inset 0 0 0 1px var(--teal)}
.prem-price .pp-sub{font-size:12px;color:var(--muted);margin-top:10px}
.prem-go{flex:none;width:100%;margin-top:14px}
.prem-pass{text-align:center;padding:16px 0 2px;color:var(--faint);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* page Moi restructurée */
.moitap{display:block;width:100%;text-align:left;cursor:pointer;margin-top:22px}
.moicard .moisub{margin-top:5px}
.moisec{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin:22px 2px 9px}
.setrow .setn .star{margin-left:5px;vertical-align:-1px}
.pbadge{font-size:9px;font-weight:700;color:#fff;background:var(--faint);padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;margin-left:6px;vertical-align:1px}
/* dashboard perso */
.dsub{font-size:13px;color:var(--muted);margin:7px 2px 18px;line-height:1.4}
.dashcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.dashcard .dlbl{font-size:12px;font-weight:700;color:var(--muted)}
.dashcard .dbigrow{display:flex;align-items:baseline;gap:11px;margin-top:4px}
.dashcard .dbig{font-family:var(--serif);font-size:34px;color:var(--teal-ink);line-height:1}
.dashcard .dcmp{font-size:12px;color:var(--faint);margin-top:6px}
.delta{font-size:12px;font-weight:700;color:var(--muted);background:var(--track);padding:2px 9px;border-radius:999px;align-self:center}
.delta.up{color:var(--teal-ink);background:var(--teal-soft)}
.dashnote{background:color-mix(in srgb,var(--teal-soft) 45%,var(--surface));border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13px;color:var(--teal-ink);line-height:1.4;margin-top:4px}
.dashempty{text-align:center;padding:48px 18px 20px;display:flex;flex-direction:column;align-items:center}
.dashempty .de-ic{width:76px;height:76px;border-radius:22px;background:var(--teal-soft);display:grid;place-items:center;margin-bottom:20px}
.dashempty .de-ic svg{width:38px;height:38px;fill:none;stroke:var(--teal-ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dashempty .de-h{font-family:var(--serif);font-size:28px;color:var(--ink);margin-bottom:8px}
.dashempty .de-d{font-size:13.5px;color:var(--muted);line-height:1.5;max-width:28ch;margin-bottom:22px}
.dashempty .de-preview{border:0;background:none;color:var(--faint);font:inherit;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* carte devenir premium */
.joincard{background:color-mix(in srgb,var(--clay) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--clay) 30%,var(--line));border-radius:16px;padding:16px}
.joincard .jc-h{font-family:var(--serif);font-size:20px;color:var(--ink);display:flex;align-items:center;gap:7px}
.joincard .jc-h .star{width:17px;height:17px}
.joincard .jc-d{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.joincard .jc-go{flex:none;width:100%;margin-top:12px}
.joincard.prem{background:color-mix(in srgb,var(--teal-soft) 50%,var(--surface));border-color:color-mix(in srgb,var(--teal) 30%,var(--line))}
.joincard .jc-manage{margin-top:12px;width:100%;background:transparent;border:1px solid color-mix(in srgb,var(--teal) 40%,var(--line));color:var(--teal-ink);border-radius:12px;padding:11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
/* Mon compte */
.acctid{display:flex;align-items:center;gap:13px;margin-top:16px;margin-bottom:4px}
.acctid .acctav{width:48px;height:48px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--clay) 15%,var(--surface));color:var(--clay);font-family:var(--serif);font-size:24px;display:grid;place-items:center}
.acctid .acctname{font-size:17px;font-weight:700}
.acctid .acctmail{font-size:13px;color:var(--muted);margin-top:1px}
.toggrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;width:100%;text-align:left}
.toggrow .sett{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.toggrow .setn{font-size:14.5px;font-weight:700;color:var(--ink)}
.toggrow .sets{font-size:11.5px;color:var(--muted)}
.switch{flex:none;width:42px;height:25px;border-radius:999px;background:var(--track);position:relative;transition:background .2s}
.switch.on{background:var(--teal)}
.switch .knob{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on .knob{left:20px}
.dangerrow{width:100%;margin-top:9px;background:transparent;border:1px solid color-mix(in srgb,var(--late) 40%,var(--line));color:var(--late);border-radius:13px;padding:13px;font:inherit;font-size:13.5px;font-weight:600;text-align:center;cursor:pointer}
.dangerrow:first-of-type{margin-top:2px}
.mailnote{font-size:12px;color:var(--muted);margin:2px 2px 10px;line-height:1.4}
.exportcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;align-items:center;gap:12px}
.exportcard .sett{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exportcard .setn{font-size:14.5px;font-weight:700;color:var(--ink)}
.exportcard .sets{font-size:11.5px;color:var(--muted)}
.exportfmts{display:flex;gap:8px;flex:none}
.fmtchip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font:inherit;font-size:13px;font-weight:700;color:var(--teal-ink);cursor:pointer}
.logoutrow{width:100%;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:14.5px;font-weight:700;color:var(--ink);text-align:center;cursor:pointer}
.moisec.danger{color:var(--late)}
/* Aide et FAQ */
.faqtheme{font-family:var(--serif);font-weight:400;font-size:17px;color:var(--teal-ink);margin:20px 2px 9px}
.faqtheme:first-of-type{margin-top:4px}
.faq{display:flex;flex-direction:column;gap:9px}
.faqitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.faqitem.open{border-color:color-mix(in srgb,var(--teal) 30%,var(--line))}
.faqq{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px 15px;text-align:left;cursor:pointer}
.faqq span{flex:1;font-size:14px;font-weight:700;color:var(--ink);line-height:1.3}
.faqchev{width:17px;height:17px;flex:none;fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.faqitem.open .faqchev{transform:rotate(180deg)}
.faqa{padding:0 15px 15px;font-size:13px;color:var(--muted);line-height:1.5}
.faqa .faqul{margin:6px 0 0;padding-left:18px}
.faqa .faqul li{margin-top:7px}
.finl{display:inline-flex;width:16px;height:16px;vertical-align:-3px;margin:0 1px}
.finl svg{width:16px;height:16px;fill:none;stroke:var(--clay);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.plusic{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--teal);vertical-align:-4px;margin:0 1px}
.plusic svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.addphoto{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:9px 13px;border:1px dashed var(--line);border-radius:12px;background:var(--bg);font-size:13px;font-weight:600;color:var(--teal-ink);cursor:pointer}
.addphoto svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.addphoto.has{border-style:solid;border-color:var(--teal);color:var(--teal-ink)}
.contactcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ctfield{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);font:inherit;font-size:14px;color:var(--ink);padding:11px 13px;outline:none}
.ctarea{resize:vertical;min-height:88px;line-height:1.4}
.ct-send{flex:none;width:100%}
.faqa .ctfield{margin-top:2px}
.faqa .ct-send{margin-top:10px}
/* noter l'app */
.ratecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.rate-stars{display:flex;justify-content:center;gap:8px}
.rstar{border:0;background:none;padding:2px;cursor:pointer;line-height:0}
.rstar svg{width:34px;height:34px;fill:none;stroke:var(--faint);stroke-width:1.4}
.rstar.on svg{fill:var(--clay);stroke:var(--clay)}
.ratecard .rate-s{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.4}
/* pop-up store */
#rateMod{position:absolute;inset:0;z-index:57;display:none;background:rgba(38,29,22,.5)}
#rateMod.show{display:flex;align-items:flex-end}
.rate-sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;box-shadow:0 -12px 40px rgba(38,29,22,.28)}
.rate-top{display:flex;justify-content:center;gap:7px;margin:8px 0 14px}
.rstar.big svg{width:30px;height:30px;fill:none;stroke:var(--clay);stroke-width:1.4}
.rstar.big.on svg{fill:var(--clay)}
.rate-bh{font-family:var(--serif);font-size:24px;margin-bottom:8px}
.rate-bs{font-size:13.5px;color:var(--muted);line-height:1.5;max-width:30ch;margin:0 auto 18px}
.rate-go{flex:none;width:100%}
.rate-later{text-align:center;padding:15px 0 2px;color:var(--faint);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#guideMod{position:absolute;inset:0;z-index:57;display:none;background:rgba(38,29,22,.5)}
#guideMod.show{display:flex;align-items:flex-end}
.guide-sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:12px 22px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;box-shadow:0 -12px 40px rgba(38,29,22,.28)}
.guide-ic{width:58px;height:58px;margin:10px auto 14px;border-radius:17px;background:color-mix(in srgb,var(--clay) 12%,var(--surface));display:grid;place-items:center}
.guide-ic .finl,.guide-ic .plusic{width:30px;height:30px;vertical-align:0;margin:0}
.guide-ic .finl svg{width:28px;height:28px}
.guide-ic .plusic{width:34px;height:34px}
.guide-ic .plusic svg{width:19px;height:19px}
.guide-h{font-family:var(--serif);font-size:26px;margin-bottom:8px}
.guide-s{font-size:14px;color:var(--muted);line-height:1.5;max-width:32ch;margin:0 auto 18px}
.guide-dots{display:flex;justify-content:center;gap:7px;margin-bottom:18px}
.guide-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.guide-dots i.on{background:var(--clay);width:20px;border-radius:4px}
.guide-row{display:flex;align-items:center;gap:12px}
.guide-skip{flex:none;color:var(--faint);font-weight:700;font-size:14px;cursor:pointer;padding:12px 4px}
.guide-next{flex:1}
.ob-step{font-size:11px;font-weight:700;color:var(--clay);letter-spacing:.06em;text-transform:uppercase}
.ob-h{font-family:var(--serif);font-size:32px;line-height:1.08;margin:8px 0 4px;text-wrap:balance}
.ob-s{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.4;max-width:30ch}
.ob-pass{margin-top:auto;text-align:center;padding:18px 0 4px;color:var(--faint);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.ob-cont{flex:none;width:100%;margin-top:20px}
.hcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px 16px;width:100%;text-align:left;margin-bottom:12px}
.hcard .hi{width:48px;height:48px;border-radius:13px;background:color-mix(in srgb,var(--teal) 10%,var(--surface));display:grid;place-items:center;color:var(--teal-ink);flex:none}
.hcard .hi svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hcard .hn{font-size:16px;font-weight:700;display:block}
.hcard .hd{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.obrooms{display:flex;flex-wrap:wrap;gap:9px}
.obrt{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--teal);box-shadow:inset 0 0 0 1px var(--teal);border-radius:13px;padding:8px 11px}
.obrt .ri{width:18px;height:18px;flex:none;color:color-mix(in srgb,var(--hue) 68%,var(--ink));stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.obrt .nm{font-size:13px;font-weight:600}
.obrt input{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;width:96px;outline:none;border-bottom:1.5px solid var(--teal);color:var(--ink)}
.obrt .pen{width:14px;height:14px;flex:none;color:var(--faint);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.obrt .rm{border:0;background:none;color:var(--faint);font-size:17px;line-height:1;padding:0 2px}
.obrt.add{border-style:dashed;border-color:var(--line);box-shadow:none;background:transparent;color:var(--muted)}
.obrt.add.on{border-color:var(--teal);color:var(--teal-ink)}
.obsug{margin-top:12px;background:color-mix(in srgb,var(--teal-soft) 40%,var(--surface));border:1px solid var(--line);border-radius:14px;padding:12px}
.obsug-h{font-size:12px;font-weight:700;color:var(--teal-ink);margin-bottom:9px}
.obsug-chips{display:flex;flex-wrap:wrap;gap:8px}
.sugchip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink)}
.sugchip.other{border-style:dashed;color:var(--muted)}
.obopt{display:flex;flex-direction:column;gap:12px}
.oboc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;text-align:left}
.oboc.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.oboc .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oboc .t .rec{font-size:9px;font-weight:700;color:#fff;background:var(--clay);padding:2px 8px;border-radius:999px}
.oboc .d{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}
/* Avatar Moi fixe (tous écrans) */
#meBtn{position:absolute;top:20px;right:18px;z-index:25;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 6px;box-shadow:0 1px 3px rgba(60,45,33,.08)}
#meBtn .mesilh2{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--clay) 14%,var(--surface));display:grid;place-items:center;flex:none}
#meBtn svg{width:18px;height:18px;stroke:var(--clay);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#meBtn .melbl{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
/* Centrages */
.planbody{min-height:calc(100dvh - 250px);display:flex;flex-direction:column;justify-content:center}
.victory{min-height:calc(100dvh - 180px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.victory .stars{display:flex;gap:11px;font-size:26px;margin-bottom:14px}
.victory .st1{color:var(--teal)} .victory .st2{color:var(--ink)} .victory .st3{color:var(--clay)}
.victory .vbig{font-family:var(--serif);font-size:36px;line-height:1.1;color:var(--ink)}
.victory .vsmall{font-size:14px;color:var(--muted);margin-top:8px}
/* Ajout — chips pièces + déjà fait */
.addchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}

/* ---------- plan ---------- */
// classe les pièces : la plus en retard d'abord, puis gestes urgents en tête dans chaque pièce
function roomsByUrgency(pool){
  const by=new Map();
  pool.forEach(t=>{if(!by.has(t.room))by.set(t.room,[]);by.get(t.room).push(t);});
  return [...by.entries()].map(([rid,items])=>({
    rid,
    items:items.sort((a,b)=>(RANK[b.state]-RANK[a.state])||(a.mins-b.mins)),
    worst:items.reduce((w,t)=>RANK[t.state]>RANK[w]?t.state:w,'ok'),
    urg:items.reduce((a,t)=>a+RANK[t.state],0)
  })).sort((a,b)=>(RANK[b.worst]-RANK[a.worst])||(b.urg-a.urg)||(room(a.rid).order-room(b.rid).order));
}
function pack(groups,chosen){return{chosen,groups,total:chosen.reduce((a,t)=>a+t.mins,0)};}
function buildPlan(mode,rid){
  let pool=tasks.filter(due);
  if(mode==='piece') pool=pool.filter(t=>t.room===rid);
  const ordered=roomsByUrgency(pool);
  // toute la maison : tout, juste rangé par pièce
  if(mode==='maison') return pack(ordered,pool);
  // « Un autre plan » : on fait tourner la pièce de départ sans casser la logique
  let seq=ordered;
  if(mode==='choisis'&&planVariant>0&&ordered.length>1){const k=planVariant%ordered.length;seq=ordered.slice(k).concat(ordered.slice(0,k));}
  // on finit une pièce avant de passer à la suivante, dans le budget temps
  let acc=0;const chosen=[];
  for(const g of seq){
    for(const t of g.items){if(acc+t.mins<=mins){chosen.push(t);acc+=t.mins;}}
  }
  if(!chosen.length&&pool.length){const sm=pool.slice().sort((a,b)=>a.mins-b.mins)[0];chosen.push(sm);acc=sm.mins;}
  const chosenGroups=seq.map(g=>({...g,items:g.items.filter(t=>chosen.includes(t))})).filter(g=>g.items.length);
  return pack(chosenGroups,chosen);
}
function bestRoom(){let best=null,bs=-1;ROOMS.forEach(r=>{const sc=roomDue(r.id).reduce((a,t)=>a+RANK[t.state],0);if(sc>bs){bs=sc;best=r.id;}});return bs>0?best:null;}

let vfxRAF=null;
function launchConfetti(canvas){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  if(vfxRAF)cancelAnimationFrame(vfxRAF);
  const ctx=canvas.getContext('2d');const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;
  const W=canvas.width,H=canvas.height;
  const COLORS=['#2d7c7e','#bd6a46','#e0b654','#f6efe0','#5f8050','#875f87'];
  let parts=[];
  function part(x,y,vx,vy){parts.push({x,y,vx,vy,g:.1*dpr,life:1,fade:.006+Math.random()*.006,s:(3+Math.random()*4)*dpr,rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,c:COLORS[(Math.random()*COLORS.length)|0]});}
  function fountain(cx,cy,n,pw,dir){for(let i=0;i<n;i++){const a=-Math.PI/2+dir+(Math.random()-.5)*.7,sp=pw*(.7+Math.random()*.6);part(cx,cy,Math.cos(a)*sp,Math.sin(a)*sp);}}
  function firework(cx,cy,n,pw){for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=pw*(.4+Math.random()*.8);part(cx,cy,Math.cos(a)*sp,Math.sin(a)*sp-pw*.15);}}
  const t0=performance.now(),shots=[0,220,480,820,1200];let fired=0;
  function frame(now){const t=now-t0;
    while(fired<shots.length&&t>=shots[fired]){
      if(fired%2===0){fountain(W*.12,H,44,10*dpr,.35);fountain(W*.88,H,44,10*dpr,-.35);}
      else{firework(W*(.3+Math.random()*.4),H*(.28+Math.random()*.22),58,7*dpr);}
      fired++;
    }
    ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=p.fade;});
    parts=parts.filter(p=>p.life>0&&p.y<H+30);
    parts.forEach(p=>{ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();});
    if(parts.length||fired<shots.length)vfxRAF=requestAnimationFrame(frame);else vfxRAF=null;
  }
  vfxRAF=requestAnimationFrame(frame);
}
/* ---------- session de focus (plein écran, une tâche à la fois) ---------- */
let focusTasks=[], focusIdx=0;
function fmtMMSS(ms){ms=Math.max(0,ms);const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function focusControl(total){return '<button class="focusstart" onclick="startFocus()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg> Démarrer le focus · '+total+' min</button>';}
function startFocus(){const plan=buildPlan(nav.mode==='piece'?'piece':'maison',nav.room);if(!plan.chosen.length)return;focusTasks=plan.chosen.map(t=>t.id);focusEnd=Date.now()+plan.total*60000;if(focusTimer)clearInterval(focusTimer);focusTimer=setInterval(tickFocus,1000);el('focus').classList.add('show');renderFocus();}
function tickFocus(){const n=el('focusTime');if(!n)return;const left=focusEnd-Date.now();if(left<=0){n.textContent='0:00';n.classList.add('over');}else n.textContent=fmtMMSS(left);}
function stopFocus(){if(focusTimer)clearInterval(focusTimer);focusTimer=null;focusEnd=null;el('focus').classList.remove('show');el('focus').innerHTML='';render();}
function focusDone(id){const t=tasks.find(x=>x.id===id);if(t&&!t.done){t._prev=t.state;t.done=true;t.doneToday=true;t.state='ok';award(t.pts);}renderFocus();}
function focusSkip(){const rem=focusTasks.filter(id=>{const t=tasks.find(x=>x.id===id);return t&&!t.done;});if(rem.length<2){renderFocus();return;}const cur=rem[0];focusTasks=focusTasks.filter(id=>id!==cur).concat(cur);renderFocus();}
function renderFocus(){
  const rem=focusTasks.map(id=>tasks.find(t=>t.id===id)).filter(t=>t&&!t.done);
  const total=focusTasks.length, done=total-rem.length;
  if(!rem.length){el('focus').innerHTML='<div class="fx-wrap"><div class="fx-end"><div class="fx-star">✦</div><div class="fx-bh">Session terminée</div><div class="fx-bs">'+total+' tâche'+(total>1?'s':'')+' pliée'+(total>1?'s':'')+'. Beau boulot.</div><button class="btn-go fx-go" onclick="stopFocus()">Terminer</button></div></div>';return;}
  const t=rem[0], r=room(t.room), left=focusEnd-Date.now();
  el('focus').innerHTML='<div class="fx-wrap">'+
    '<div class="fx-top"><span class="fx-time'+(left<=0?' over':'')+'" id="focusTime">'+fmtMMSS(left)+'</span><button class="fx-close" onclick="stopFocus()">Arrêter</button></div>'+
    '<div class="fx-mid"><div class="fx-prog">Tâche '+(done+1)+' sur '+total+'</div>'+
      '<div class="fx-room" style="color:color-mix(in srgb,'+r.hue+' 72%,var(--ink))">'+esc(r.name)+'</div>'+
      '<div class="fx-task">'+esc(t.name)+'</div><div class="fx-mins">~'+t.mins+' min</div></div>'+
    '<div class="fx-actions"><button class="btn-go fx-done" onclick="focusDone('+t.id+')">C’est fait ✓</button>'+
      '<button class="fx-skip" onclick="focusSkip()">Passer cette tâche</button></div></div>';
}

function viewPlan(){

    const names=plan.groups.map(g=>room(g.rid).name.toLowerCase());

function aujOrderIds(){const ids=ROOMS.map(r=>r.id);if(!aujOrder)return ids.slice();return aujOrder.filter(id=>ids.includes(id)).concat(ids.filter(id=>!aujOrder.includes(id)));}
function resetAujOrder(){aujOrder=null;render();}
function toggleAujRoom(id){if(aujCollapsed.has(id))aujCollapsed.delete(id);else aujCollapsed.add(id);render();}
function aujDragStart(e,id){
  e.preventDefault();e.stopPropagation();
  dragEl=document.querySelector('.aujroom[data-aroom="'+id+'"]');
  if(!dragEl)return;
  window._aujDrag=true;dragRoom=id;dragStartY=e.clientY;
  dragEl.classList.add('dragging');
  try{dragEl.setPointerCapture(e.pointerId);}catch(_){}
  document.addEventListener('pointermove',aujDragMove,{passive:false});
  document.addEventListener('pointerup',aujDragEnd);
}
function aujDragMove(e){
  if(!dragEl)return;e.preventDefault();
  dragEl.style.transform='translateY('+(e.clientY-dragStartY)+'px)';
  const cy=e.clientY;
  for(const sib of document.querySelectorAll('.aujroom:not(.dragging)')){
    const rct=sib.getBoundingClientRect();
    if(cy>rct.top&&cy<rct.bottom){
      const mid=rct.top+rct.height/2, parent=dragEl.parentNode;
      if(cy<mid){if(sib.previousElementSibling!==dragEl){parent.insertBefore(dragEl,sib);dragStartY=e.clientY;dragEl.style.transform='translateY(0px)';}}
      else{if(sib.nextElementSibling!==dragEl){parent.insertBefore(dragEl,sib.nextElementSibling);dragStartY=e.clientY;dragEl.style.transform='translateY(0px)';}}
      break;
    }
  }
}
function aujDragEnd(){
  document.removeEventListener('pointermove',aujDragMove);
  document.removeEventListener('pointerup',aujDragEnd);
  if(dragEl){dragEl.classList.remove('dragging');dragEl.style.transform='';}
  const ids=[...document.querySelectorAll('.aujroom')].map(x=>x.getAttribute('data-aroom'));
  if(ids.length)aujOrder=ids;
  dragEl=null;dragRoom=null;render();
  setTimeout(()=>{window._aujDrag=false;},100);
}
